<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="1126" viewBox="0 0 1060 1126"><rect x="0.0" y="0.0" width="1060.0" height="1126.0" rx="0" fill="#FFFFFF" stroke="none" stroke-width="0"/><text x="530.0" y="28.0" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#111111" text-anchor="middle">Figure 3.20  Flowchart - Authentication and Session Establishment</text><text x="530.0" y="46.0" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#5A5A5A" text-anchor="middle">Three gates in a fixed order: identity, then tenancy, then authorization</text><rect x="365.0" y="84.0" width="150.0" height="36.0" rx="18.0" fill="#F4F4F4" stroke="#111111" stroke-width="1.4"/><text x="440.0" y="105.8" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#111111" text-anchor="middle">START</text><rect x="270.0" y="154.0" width="340.0" height="46.0" rx="12" fill="#FFFFFF" stroke="#111111" stroke-width="1.4"/><text x="440.0" y="174.3" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#111111" text-anchor="middle">User submits e-mail + password</text><text x="440.0" y="187.3" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">web: Fortify  |  mobile: POST /api/auth/login</text><polygon points="440.0,234.0 570.0,276.0 440.0,318.0 310.0,276.0" fill="#FFFFFF" stroke="#111111" stroke-width="1.4"/><text x="440.0" y="273.4" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#111111" text-anchor="middle">Credentials valid?</text><text x="440.0" y="286.4" font-family="Arial, Helvetica, sans-serif" font-size="8.7" font-weight="normal" fill="#5A5A5A" text-anchor="middle">throttled per e-mail + IP</text><polygon points="440.0,352.0 590.0,394.0 440.0,436.0 290.0,394.0" fill="#FFFFFF" stroke="#111111" stroke-width="1.4"/><text x="440.0" y="391.4" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#111111" text-anchor="middle">Second factor enrolled?</text><text x="440.0" y="404.4" font-family="Arial, Helvetica, sans-serif" font-size="8.7" font-weight="normal" fill="#5A5A5A" text-anchor="middle">TOTP or passkey - optional</text><rect x="290.0" y="470.0" width="300.0" height="52.0" rx="12" fill="#FFFFFF" stroke="#111111" stroke-width="1.4"/><text x="440.0" y="493.4" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#111111" text-anchor="middle">Verify second factor</text><text x="440.0" y="506.4" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">TOTP code / WebAuthn assertion</text><polygon points="440.0,556.0 570.0,593.0 440.0,630.0 310.0,593.0" fill="#FFFFFF" stroke="#111111" stroke-width="1.4"/><text x="440.0" y="596.9" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#111111" text-anchor="middle">Factor verified?</text><rect x="250.0" y="664.0" width="380.0" height="60.0" rx="12" fill="#FFFFFF" stroke="#111111" stroke-width="1.4"/><text x="440.0" y="691.4" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#111111" text-anchor="middle">Resolve active organisation</text><text x="440.0" y="704.4" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">web: session active_organization_id  |  mobile: token binding</text><polygon points="440.0,752.0 590.0,791.0 440.0,830.0 290.0,791.0" fill="#FFFFFF" stroke="#111111" stroke-width="1.4"/><text x="440.0" y="788.4" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#111111" text-anchor="middle">Member of that organisation?</text><text x="440.0" y="801.4" font-family="Arial, Helvetica, sans-serif" font-size="8.5" font-weight="normal" fill="#5A5A5A" text-anchor="middle">checked against organization_user</text><polygon points="440.0,860.0 590.0,899.0 440.0,938.0 290.0,899.0" fill="#FFFFFF" stroke="#111111" stroke-width="1.4"/><text x="440.0" y="902.9" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#111111" text-anchor="middle">Belongs to more than one?</text><rect x="660.0" y="860.0" width="250.0" height="60.0" rx="12" fill="#FFFFFF" stroke="#111111" stroke-width="1.4"/><text x="785.0" y="887.4" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#111111" text-anchor="middle">Show workspace picker</text><text x="785.0" y="900.4" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">user chooses; session persists it</text><rect x="250.0" y="970.0" width="380.0" height="60.0" rx="12" fill="#FFFFFF" stroke="#111111" stroke-width="1.4"/><text x="440.0" y="997.4" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#111111" text-anchor="middle">Load role permissions and establish session</text><text x="440.0" y="1010.4" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">gates defined from PermissionRegistry at boot</text><rect x="360.0" y="1062.0" width="160.0" height="36.0" rx="18.0" fill="#F4F4F4" stroke="#111111" stroke-width="1.4"/><text x="440.0" y="1083.8" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#111111" text-anchor="middle">DASHBOARD</text><rect x="70.0" y="200.0" width="230.0" height="56.0" rx="3" fill="#FFFFFF" stroke="#111111" stroke-width="1.4" stroke-dasharray="6 4"/><text x="185.0" y="225.3" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#111111" text-anchor="middle">Return to sign-in with error</text><text x="185.0" y="238.3" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">attempt