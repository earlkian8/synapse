roke-width="1.4"/><text x="430.0" y="316.4" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#111111" text-anchor="middle">Compute chargeable days on the SERVER</text><text x="430.0" y="329.4" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">LeaveCalculator; a client-sent count is never trusted</text><polygon points="430.0,370.0 600.0,409.0 430.0,448.0 260.0,409.0" fill="#FFFFFF" stroke="#111111" stroke-width="1.4"/><text x="430.0" y="412.9" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#111111" text-anchor="middle">Dates valid and balance sufficient?</text><rect x="60.0" y="300.0" width="240.0" height="60.0" rx="3" fill="#FFFFFF" stroke="#111111" stroke-width="1.4" stroke-dasharray="6 4"/><text x="180.0" y="327.4" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#111111" text-anchor="middle">Return to the form with errors</text><text x="180.0" y="340.4" font-family="Arial, Helvetica, sans-serif" font-size="8.7" font-weight="normal" fill="#5A5A5A" text-anchor="middle">invalid requests never enter the workflow</text><polygon points="430.0,478.0 600.0,517.0 430.0,556.0 260.0,517.0" fill="#FFFFFF" stroke="#111111" stroke-width="1.4"/><text x="430.0" y="520.9" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#111111" text-anchor="middle">Does the type require approval?</text><rect x="790.0" y="488.0" width="230.0" height="58.0" rx="12" fill="#FFFFFF" stroke="#111111" stroke-width="1.4"/><text x="905.0" y="514.4" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#111111" text-anchor="middle">Auto-approve on submission</text><text x="905.0" y="527.4" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">status = approved</text><rect x="240.0" y="588.0" width="380.0" height="58.0" rx="12" fill="#FFFFFF" stroke="#111111" stroke-width="1.4"/><text x="430.0" y="614.4" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#111111" text-anchor="middle">Persist as PENDING (tenant-scoped)</text><text x="430.0" y="627.4" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">organization_id stamped by the model layer</text><rect x="240.0" y="676.0" width="380.0" height="58.0" rx="12" fill="#FFFFFF" stroke="#111111" stroke-width="1.4"/><text x="430.0" y="702.4" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#111111" text-anchor="middle">Notify the approver audience</text><text x="430.0" y="715.4" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">Notifier::toRole('hr-manager') - in-app + e-mail + push</text><polygon points="430.0,764.0 580.0,803.0 430.0,842.0 280.0,803.0" fill="#FFFFFF" stroke="#111111" stroke-width="1.4"/><text x="430.0" y="806.9" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#111111" text-anchor="middle">Approved?</text><rect x="760.0" y="768.0" width="260.0" height="70.0" rx="12" fill="#FFFFFF" stroke="#111111" stroke-width="1.4"/><text x="890.0" y="800.4" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#111111" text-anchor="middle">Mark REJECTED + reason</text><text x="890.0" y="813.4" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">balance untouched</text><rect x="240.0" y="872.0" width="380.0" height="58.0" rx="12" fill="#FFFFFF" stroke="#111111" stroke-width="1.4"/><text x="430.0" y="898.4" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#111111" text-anchor="middle">Mark APPROVED</text><text x="430.0" y="911.4" font-family="Arial, Helvetica, sans-serif" 