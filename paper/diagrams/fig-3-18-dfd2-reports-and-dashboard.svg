<svg xmlns="http://www.w3.org/2000/svg" width="1302" height="1055" viewBox="0 0 1302 1055"><rect x="0.0" y="0.0" width="1302.0" height="1055.0" rx="0" fill="#FFFFFF" stroke="none" stroke-width="0"/><text x="651.0" y="28.0" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#111111" text-anchor="middle">Figure 3.18  Level-2 Data Flow Diagram - Reports and Dashboard</text><text x="651.0" y="46.0" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#5A5A5A" text-anchor="middle">One report class as the single source of table, totals, charts, export and insight</text><rect x="26.0" y="196.0" width="190.0" height="84.0" rx="0" fill="#FFFFFF" stroke="#111111" stroke-width="2.0"/><text x="121.0" y="241.7" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="normal" fill="#111111" text-anchor="middle">HR Manager</text><rect x="26.0" y="612.0" width="190.0" height="84.0" rx="0" fill="#FFFFFF" stroke="#111111" stroke-width="2.0"/><text x="121.0" y="657.7" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="normal" fill="#111111" text-anchor="middle">Executive / Auditor</text><rect x="300.0" y="92.0" width="356.0" height="84.0" rx="8" fill="#FFFFFF" stroke="#111111" stroke-width="1.4"/><path d="M 300.0 110.0 L 656.0 110.0" fill="none" stroke="#111111" stroke-width="1.0"/><text x="478.0" y="105.5" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="bold" fill="#111111" text-anchor="middle">13.1</text><text x="478.0" y="133.7" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="normal" fill="#111111" text-anchor="middle">Resolve the report</text><text x="478.0" y="146.7" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">the registry returns only the reports the</text><text x="478.0" y="159.7" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">viewer is permitted to see</text><rect x="300.0" y="196.0" width="356.0" height="84.0" rx="8" fill="#FFFFFF" stroke="#111111" stroke-width="1.4"/><path d="M 300.0 214.0 L 656.0 214.0" fill="none" stroke="#111111" stroke-width="1.0"/><text x="478.0" y="209.5" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="bold" fill="#111111" text-anchor="middle">13.2</text><text x="478.0" y="237.7" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="normal" fill="#111111" text-anchor="middle">Run the report</text><text x="478.0" y="250.7" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">one class owns its filters, columns, rows,</text><text x="478.0" y="263.7" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">charts, totals and export</text><rect x="300.0" y="300.0" width="356.0" height="84.0" rx="8" fill="#FFFFFF" stroke="#111111" stroke-width="1.4"/><path d="M 300.0 318.0 L 656.0 318.0" fill="none" stroke="#111111" stroke-width="1.0"/><text x="478.0" y="313.5" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="bold" fill="#111111" text-anchor="middle">13.3</text><text x="478.0" y="341.7" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="normal" fill="#111111" text-anchor="middle">Derive the charts</text><text x="478.0" y="354.7" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">computed over the WHOLE result set,</text><text x="478.0" y="367.7" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">not the page currently on screen</text><rect x="300.0" y="404.0" width="356.0" height="84.0" rx="8" fill="#FFFFFF" stroke="#111111" stroke-width="1.4"/><path d="M 300.0 422.0 L 656.0 422.0" fill="none" stroke="#111111" stroke-width="1.0"/><text x="478.0" y="417.5" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="bold" fill="#111111" text-anchor="middle">13.4</text><text x="478.0" y="445.7" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="normal" fill="#111111" text-anchor="middle">Attach the ML signals</text><text x="478.0" y="458.7" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">read the latest STORED runs, so a report</text><text x="478.0" y="471.7" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">never blocks on a live network call</text><rect x="300.0" y="508.0" width="356.0" height="84.0" rx="8" fill="#FFFFFF" stroke="#111111" stroke-width="1.4"/><path d="M 300.0 526.0 L 656.0 526.0" fill="none" stroke="#111111" stroke-width="1.0"/><text x="478.0" y="521.5" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="bold" fill="#111111" text-anchor="middle">13.5</text><text x="478.0" y="549.7" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="normal" fill="#111111" text-anchor="middle">Generate the AI insight</text><text x="478.0" y="562.7" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">re-resolves, re-authorises and re-runs the</text><text x="478.0" y="575.7" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">report server-side; browser numbers are ignored</text><rect x="300.0" y="612.0" width="356.0" height="84.0" rx="8" fill="#FFFFFF" stroke="#111111" stroke-width="1.4"/><path d="M 300.0 630.0 L 656.0 630.0" fill="none" stroke="#111111" stroke-width="1.0"/><text x="478.0" y="625.5" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="bold" fill="#111111" text-anchor="middle">13.6</text><text x="478.0" y="653.7" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="normal" fill="#111111" text-anchor="middle">Export CSV / XLSX</text><text x="478.0" y="666.7" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">exactly the rows the auditor saw,</text><text x="478.0" y="679.7" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">with optional PII redaction</text><rect x="300.0" y="716.0" width="356.0" height="84.0" rx="8" fill="#FFFFFF" stroke="#111111" stroke-width="1.4"/><path d="M 300.0 734.0 L 656.0 734.0" fill="none" stroke="#111111" stroke-width="1.0"/><text x="478.0" y="729.5" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="bold" fill="#111111" text-anchor="middle">13.7</text><text x="478.0" y="757.7" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="normal" fill="#111111" text-anchor="middle">Compose the dashboard</text><text x="478.0" y="770.7" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">reuses each module's own statistics class,</text><text x="478.0" y="783.7" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">so headline numbers have one source</text><rect x="300.0" y="820.0" width="356.0" height="84.0" rx="8" fill="#FFFFFF" stroke="#111111" stroke-width="1.4"/><path d="M 300.0 838.0 L 656.0 838.0" fill="none" stroke="#111111" stroke-width="1.0"/><text x="478.0" y="833.5" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="bold" fill="#111111" text-anchor="middle">13.8</text><text x="478.0" y="861.7" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="normal" fill="#111111" text-anchor="middle">Build the attention queue</text><text x="478.0" y="874.7" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">only rows the viewer can act on and that</text><text x="478.0" y="887.7" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">need action; empty rows are dropped</text><rect x="740.0" y="210.0" width="268.0" height="56.0" rx="0" fill="#FFFFFF" stroke="#111111" stroke-width="1.4"/><path d="M 766.0 210.0 L 766.0 266.0" fill="none" stroke="#111111" stroke-width="1.0"/><text x="753.0" y="241.5" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="bold" fill="#111111" text-anchor="middle">D13.1</text><text x="887.0" y="235.0" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="normal" fill="#111111" text-anchor="middle">every module store</text><text x="887.0" y="248.0" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">read-only</text><rect x="740.0" y="418.0" width="268.0" height="56.0" rx="0" fill="#FFFFFF" stroke="#111111" stroke-width="1.4"/><path d="M 766.0 418.0 L 766.0 474.0" fill="none" stroke="#111111" stroke-width="1.0"/><text x="753.0" y="449.5" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="bold" fill="#111111" text-anchor="middle">D13.2</text><text x="887.0" y="443.0" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="normal" fill="#111111" text-anchor="middle">activity_logs</text><text x="887.0" y="456.0" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">the audit trail report</text><rect x="740.0" y="522.0" width="268.0" height="56.0" rx="0" fill="#FFFFFF" stroke="#111111" stroke-width="1.4"/><path d="M 766.0 522.0 L 766.0 578.0" fill="none" stroke="#111111" stroke-width="1.0"/><text x="753.0" y="553.5" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="bold" fill="#111111" text-anchor="middle">D13.3</text><text x="887.0" y="553.5" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="normal" fill="#111111" text-anchor="middle">*_runs, *_scores</text><rect x="1064.0" y="570.4" width="210.0" height="84.0" rx="0" fill="#FFFFFF" stroke="#111111" stroke-width="2.0" stroke-dasharray="6 4"/><text x="1169.0" y="615.9" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="normal" fill="#111111" text-anchor="middle">Gemini API</text><rect x="1064.0" y="716.0" width="210.0" height="84.0" rx="0" fill="#FFFFFF" stroke="#111111" stroke-width="2.0"/><text x="1169.0" y="755.0" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="normal" fill="#111111" text-anchor="middle">Downloaded file</text><text x="1169.0" y="768.0" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">CSV / XLSX</text><path d="M 216.0 238.0 L 258.0 238.0 L 258.0 134.0 L 300.0 134.0" fill="none" stroke="#111111" stroke-width="1.4"/><polygon points="300.0,134.0 291.0,139.4 291.0,128.6" fill="#111111" stroke="none" stroke-width="1.4"/><path d="M 216.0 654.0 L 258.0 654.0 L 258.0 134.0 L 300.0 134.0" fill="none" stroke="#111111" stroke-width="1.4"/><polygon points="300.0,134.0 291.0,139.4 291.0,128.6" fill="#111111" stroke="none" stroke-width="1.4"/><path d="M 478.0 176.0 L 478.0 196.0" fill="none" stroke="#111111" stroke-width="1.4"/><polygon points="478.0,196.0 472.6,187.0 483.4,187.0" fill="#111111" stroke="none" stroke-width="1.4"/><path d="M 740.0 238.0 L 656.0 238.0" fill="none" stroke="#111111" stroke-width="1.4"/><polygon points="656.0,238.0 665.0,232.6 665.0,243.4" fill="#111111" stroke="none" stroke-width="1.4"/><path d="M 740.0 446.0 L 698.0 446.0 L 698.0 238.0 L 656.0 238.0" fill="none" stroke="#111111" stroke-width="1.4"/><polygon points="656.0,238.0 665.0,232.6 665.0,243.4" fill="#111111" stroke="none" stroke-width="1.4"/><path d="M 478.0 280.0 L 478.0 300.0" fill="none" stroke="#111111" stroke-width="1.