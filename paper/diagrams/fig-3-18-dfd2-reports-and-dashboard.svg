roke="none" stroke-width="1.4"/><polygon points="656.0,862.0 665.0,856.6 665.0,867.4" fill="#111111" stroke="none" stroke-width="1.4"/><path d="M 478.0 800.0 L 478.0 820.0" fill="none" stroke="#111111" stroke-width="1.4"/><polygon points="478.0,820.0 472.6,811.0 483.4,811.0" fill="#111111" stroke="none" stroke-width="1.4"/><rect x="649.7" y="222.1" width="96.6" height="13.7" rx="2" fill="#FFFFFF" stroke="none" stroke-width="0"/><text x="698.0" y="232.0" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="normal" fill="#111111" text-anchor="middle">tenant-scoped rows</text><rect x="644.6" y="482.1" width="106.7" height="13.7" rx="2" fill="#FFFFFF" stroke="none" stroke-width="0"/><text x="698.0" y="492.0" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="normal" fill="#111111" text-anchor="middle">stored run summaries</text><rect x="761.3" y="565.3" width="197.3" height="13.7" rx="2" fill="#FFFFFF" stroke="none" stroke-width="0"/><text x="860.0" y="575.2" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="normal" fill="#111111" text-anchor="middle">totals, chart aggregates, a row sample</text><text x="30.0" y="938.0" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="bold" fill="#111111" text-anchor="start">LEGEND</text><rect x="30.0" y="944.0" width="22.0" height="12.0" rx="0" fill="#FFFFFF" stroke="#111111" stroke-width="2.0"/><text x="60.0" y="953.5" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="normal" fill="#5A5A5A" text-anchor="start">external entity</text><rect x="30.0" y="961.0" width="22.0" height="12.0" rx="6" fill="#FFFFFF" stroke="#111111" stroke-width="1.0"/><text x="60.0" y="970.5" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="normal" fill="#5A5A5A" text-anchor="start">process</text><rect x="30.0" y="978.0" width="22.0" height="12.0" rx="0" fill="#FFFFFF" stroke="#111111" stroke-width="1.0"/><path d="M 37.0 978.0 L 37.0 990.0" fill="none" stroke="#111111" stroke-width="1.0"/><text x="60.0" y="987.5" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="normal" fill="#5A5A5A" text-anchor="start">data store</text><path d="M 30.0 1001.0 L 52.0 1001.0" fill="none" stroke="#111111" stroke-width="1.4"/><polygon points="52.0,1001.0 43.0,1006.4 43.0,995.6" fill="#111111" stroke="none" stroke-width="1.4"/><text x="60.0" y="1004.5" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="normal" fill="#5A5A5A" text-anchor="start">data flow</text><path d="M 30.0 1018.0 L 52.0 1018.0" fill="none" stroke="#111111" stroke-width="1.4" stroke-dasharray="6 4"/><polygon points="52.0,1018.0 43.0,1023.4 43.0,1012.6" fill="#111111" stroke="none" stroke-width="1.4"/><text x="60.0" y="1021.5" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="normal" fill="#5A5A5A" text-anchor="start">external / derived flow</text><text x="770.0" y="1010.0" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="normal" fill="#5A5A5A" text-anchor="middle">One source feeds the on-screen table, the totals, the charts, the export and the AI digest - so they cannot disagree with one another.</text></svg>