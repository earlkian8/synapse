" stroke="#111111" stroke-width="1.4"/><path d="M 766.0 418.0 L 766.0 474.0" fill="none" stroke="#111111" stroke-width="1.0"/><text x="753.0" y="449.5" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="bold" fill="#111111" text-anchor="middle">D8.4</text><text x="887.0" y="449.5" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="normal" fill="#111111" text-anchor="middle">attendance_records</text><rect x="740.0" y="626.0" width="268.0" height="56.0" rx="0" fill="#FFFFFF" stroke="#111111" stroke-width="1.4"/><path d="M 766.0 626.0 L 766.0 682.0" fill="none" stroke="#111111" stroke-width="1.0"/><text x="753.0" y="657.5" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="bold" fill="#111111" text-anchor="middle">D8.5</text><text x="887.0" y="651.0" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="normal" fill="#111111" text-anchor="middle">training_enrollments</text><text x="887.0" y="664.0" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">employees (tenure)</text><rect x="1064.0" y="612.0" width="210.0" height="84.0" rx="0" fill="#FFFFFF" stroke="#111111" stroke-width="2.0" stroke-dasharray="6 4"/><text x="1169.0" y="657.5" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="normal" fill="#111111" text-anchor="middle">Gemini API</text><path d="M 1064.0 240.4 H 1262.0 L 1274.0 252.4 V 360.4 H 1064.0 Z" fill="#FFFFFF" stroke="#111111" stroke-width="1.0"/><path d="M 1262.0 240.4 V 252.4 H 1274.0" fill="none" stroke="#111111" stroke-width="1.0"/><text x="1169.0" y="277.7" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="normal" fill="#111111" text-anchor="middle">ARITHMETIC FIRST</text><text x="1169.0" y="290.7" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">The entire ranking is</text><text x="1169.0" y="303.7" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">deterministic. The LLM only</text><text x="1169.0" y="316.7" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">writes the words, after the</text><text x="1169.0" y="329.7" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">decision has been made.</text><path d="M 216.0 238.0 L 258.0 238.0 L 258.0 134.0 L 300.0 134.0" fill="none" stroke="#111111" stroke-width="1.4"/><polygon points="300.0,134.0 291.0,139.4 291.0,128.6" fill="#111111" stroke="none" stroke-width="1.4"/><path d="M 216.0 238.0 L 258.0 238.0 L 258.0 758.0 L 300.0 758.0" fill="none" stroke="#111111" stroke-width="1.4"/><polygon points="300.0,758.0 291.0,763.4 291.0,752.6" fill="#111111" stroke="none" stroke-width="1.4"/><path d="M 656.0 134.0 L 700.0 134.0 L 700.0 134.0 L 740.0 134.0" fill="none" stroke="#111111" stroke-width="1.4"/><polygon points="740.0,134.0 731.0,139.4 731.0,128.6" fill="#111111" stroke="none" stroke-width="1.4"/><polygon points="656.0,134.0 665.0,128.6 665.0,139.4" fill="#111111" stroke="none" stroke-width="1.4"/><path d="M 478.0 176.0 L 478.0 196.0" fill="none" stroke="#111111" stroke-width="1.4"/><polygon points="478.0,196.0 472.6,187.0 483.4,187.0" fill="#111111" stroke="none" stroke-width="1.4"/><path d="M 478.0 280.0 L 478.0 300.0" fill="none" stroke="#111111" stroke-width="1.4"/><polygon points="478.0,300.0 472.6,291.0 483.4,291.0" fill="#111111" stroke="none" stroke-width="1.4"/><path d="M 740.0 342.0 L 656.0 342.0" fill="none" stroke="#111111" stroke-width="1.4"/><polygon points="656.0,342.0 665.0,336.6 665.0,347.4" fill="#111111" stroke="none" stroke-width="1.4"/><path d="M 740.0 446.0 L 698.0 446.0 L 698.0 342.0 L 656.0 342.0" fill="none" stroke="#111111" stroke-width="1.4"/><polygon points="656.0,342.0 665.0,336.6 665.0,347.4" fill="#111111"