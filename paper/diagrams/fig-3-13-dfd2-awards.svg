<svg xmlns="http://www.w3.org/2000/svg" width="1302" height="1055" viewBox="0 0 1302 1055"><rect x="0.0" y="0.0" width="1302.0" height="1055.0" rx="0" fill="#FFFFFF" stroke="none" stroke-width="0"/><text x="651.0" y="28.0" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#111111" text-anchor="middle">Figure 3.13  Level-2 Data Flow Diagram - Awards</text><text x="651.0" y="46.0" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#5A5A5A" text-anchor="middle">Six weighted signals, a focus profile per award type, and a repeat-winner guard</text><rect x="26.0" y="196.0" width="190.0" height="84.0" rx="0" fill="#FFFFFF" stroke="#111111" stroke-width="2.0"/><text x="121.0" y="241.7" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="normal" fill="#111111" text-anchor="middle">HR Manager</text><rect x="26.0" y="716.0" width="190.0" height="84.0" rx="0" fill="#FFFFFF" stroke="#111111" stroke-width="2.0"/><text x="121.0" y="755.2" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="normal" fill="#111111" text-anchor="middle">Employee</text><text x="121.0" y="768.2" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">recipient and viewer</text><rect x="300.0" y="92.0" width="356.0" height="84.0" rx="8" fill="#FFFFFF" stroke="#111111" stroke-width="1.4"/><path d="M 300.0 110.0 L 656.0 110.0" fill="none" stroke="#111111" stroke-width="1.0"/><text x="478.0" y="105.5" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="bold" fill="#111111" text-anchor="middle">8.1</text><text x="478.0" y="133.7" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="normal" fill="#111111" text-anchor="middle">Maintain award types</text><text x="478.0" y="146.7" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">name, description, accent colour,</text><text x="478.0" y="159.7" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">active flag</text><rect x="300.0" y="196.0" width="356.0" height="84.0" rx="8" fill="#FFFFFF" stroke="#111111" stroke-width="1.4"/><path d="M 300.0 214.0 L 656.0 214.0" fill="none" stroke="#111111" stroke-width="1.0"/><text x="478.0" y="209.5" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="bold" fill="#111111" text-anchor="middle">8.2</text><text x="478.0" y="237.7" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="normal" fill="#111111" text-anchor="middle">Classify the focus profile</text><text x="478.0" y="250.7" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">keyword match over name + description:</text><text x="478.0" y="263.7" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">performance / attendance / tenure / growth</text><rect x="300.0" y="300.0" width="356.0" height="84.0" rx="8" fill="#FFFFFF" stroke="#111111" stroke-width="1.4"/><path d="M 300.0 318.0 L 656.0 318.0" fill="none" stroke="#111111" stroke-width="1.0"/><text x="478.0" y="313.5" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="bold" fill="#111111" text-anchor="middle">8.3</text><text x="478.0" y="341.7" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="normal" fill="#111111" text-anchor="middle">Gather the six signals</text><text x="478.0" y="354.7" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">performance, ML forecast, attendance,</text><text x="478.0" y="367.7" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">training, tenure, recognition gap</text><rect x="300.0" y="404.0" width="356.0" height="84.0" rx="8" fill="#FFFFFF" stroke="#111111" stroke-width="1.4"/><path d="M 300.0 422.0 L 656.0 422.0" fill="none" stroke="#111111" stroke-width="1.0"/><text x="478.0" y="417.5" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="bold" fill="#111111" text-anchor="middle">8.4</text><text x="478.0" y="445.7" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="normal" fill="#111111" text-anchor="middle">Score and rank nominees</text><text x="478.0" y="458.7" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">weighted per profile, normalised over the</text><text x="478.0" y="471.7" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">signals that can be assessed (Figure 3.27)</text><rect x="300.0" y="508.0" width="356.0" height="84.0" rx="8" fill="#FFFFFF" stroke="#111111" stroke-width="1.4"/><path d="M 300.0 526.0 L 656.0 526.0" fill="none" stroke="#111111" stroke-width="1.0"/><text x="478.0" y="521.5" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="bold" fill="#111111" text-anchor="middle">8.5</text><text x="478.0" y="549.7" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="normal" fill="#111111" text-anchor="middle">Apply the fairness guard</text><text x="478.0" y="562.7" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">a same-type win inside six months zeroes</text><text x="478.0" y="575.7" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">the gap signal and flags the nominee</text><rect x="300.0" y="612.0" width="356.0" height="84.0" rx="8" fill="#FFFFFF" stroke="#111111" stroke-width="1.4"/><path d="M 300.0 630.0 L 656.0 630.0" fill="none" stroke="#111111" stroke-width="1.0"/><text x="478.0" y="625.5" font-family=