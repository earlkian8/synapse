<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820"><rect x="0.0" y="0.0" width="1200.0" height="820.0" rx="0" fill="#FFFFFF" stroke="none" stroke-width="0"/><text x="600.0" y="28.0" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#111111" text-anchor="middle">Figure 3.29  Machine Learning Training Pipeline</text><text x="600.0" y="46.0" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#5A5A5A" text-anchor="middle">One shared preprocessing recipe, three estimators, and a recall-oriented threshold sweep</text><rect x="50.0" y="224.0" width="640.0" height="250.0" rx="6" fill="#FFFFFF" stroke="#111111" stroke-width="1.4" stroke-dasharray="6 4"/><rect x="50.0" y="92.0" width="262.0" height="96.0" rx="3" fill="#FFFFFF" stroke="#111111" stroke-width="1.4"/><text x="181.0" y="130.8" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="bold" fill="#111111" text-anchor="middle">Acquire and freeze dataset</text><text x="181.0" y="143.8" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">read-only copy; public corpus or</text><text x="181.0" y="156.8" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">schema-native partner extract</text><rect x="328.0" y="92.0" width="262.0" height="96.0" rx="3" fill="#FFFFFF" stroke="#111111" stroke-width="1.4"/><text x="459.0" y="130.8" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="bold" fill="#111111" text-anchor="middle">Profile</text><text x="459.0" y="143.8" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">shape, nulls, duplicates, outliers,</text><text x="459.0" y="156.8" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">target distribution, class balance</text><rect x="606.0" y="92.0" width="262.0" height="96.0" rx="3" fill="#FFFFFF" stroke="#111111" stroke-width="1.4"/><text x="737.0" y="130.8" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="bold" fill="#111111" text-anchor="middle">Feature selection</text><text x="737.0" y="143.8" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">restrict to ERP-SERVABLE columns;</text><text x="737.0" y="156.8" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">drop protected attributes; drop leaks</text><rect x="884.0" y="92.0" width="262.0" height="96.0" rx="3" fill="#FFFFFF" stroke="#111111" stroke-width="1.4"/><text x="1015.0" y="130.8" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="bold" fill="#111111" text-anchor="middle">Partition</text><text x="1015.0" y="143.8" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">80 / 20 stratified on the target;</text><text x="1015.0" y="156.8" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">the test split is withheld until the end</text><rect x="70.0" y="260.0" width="280.0" height="76.0" rx="3" fill="#FFFFFF" stroke="#111111" stroke-width="1.4"/><text x="210.0" y="288.9" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#111111" text-anchor="middle">numeric branch</text><text x="210.0" y="301.9" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">SimpleImputer(strategy='median')</text><text x="210.0" y="314.9" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">-&gt; StandardScaler()</text><rect x="370.0" y="260.0" width="300.0" height="76.0" rx="3" fill="#FFFFFF" stroke="#111111" stroke-width="1.4"/><text x="520.0" y="288.9" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#111111" text-anchor="middle">categorical branch</text><text x="520.0" y="301.9" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">SimpleImputer(strategy='most_frequent')</text><text x="520.0" y="314.9" font-family="Arial, Helvetica, sans-serif" font-size="8.6" font-weight="normal" fill="#5A5A5A" text-anchor="middle">-&gt; OneHotEncoder(handle_unknown='ignore')</text><rect x="70.0" y="358.0" width="600.0" height="42.0" rx="3" fill="#F4F4F4" stroke="#111111" stroke-width="1.4"/><text x="370.0" y="382.9" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#111111" text-anchor="middle">ColumnTransformer</text><rect x="70.0" y="414.0" width="600.0" height="46.0" rx="3" fill="#E4E4E4" stroke="#111111" stroke-width="1.4"/><text x="370.0" y="440.9" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#111111" text-anchor="middle">estimator: RandomForestClassifier | HistGradientBoostingRegressor | LogisticRegression</text><rect x="730.0" y="240.0" width="420.0" height="82.0" rx="3" fill="#FFFFFF" stroke="#111111" stroke-width="1.4"/><text x="940.0" y="265.4" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="bold" fill="#111111" text-anchor="middle">Cross-validate</text><text x="940.0" y="278.4" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">stratified 5-fold on the training split;</text><text x="940.0" y="291.4" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">class imbalance handled by cost-sensitive</text><text x="940.0" y="304.4" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">learning (balanced class weights)</text><rect x="730.0" y="338.0" width="420.0" height="82.0" rx="3" fill="#FFFFFF" stroke="#111111" stroke-width="1.4"/><text x="940.0" y="363.4" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="bold" fill="#111111" text-anchor="middle">Tune</text><text x="940.0" y="376.4" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">grid search inside the CV loop;</text><text x="940.0" y="389.4" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">then a RECALL-ORIENTED decision-threshold</text><text x="940.0" y="402.4" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">sweep instead of defaulting to 0.5</text><rect x="730.0" y="436.0" width="420.0" height="82.0" rx="3" fill="#FFFFFF" stroke="#111111" stroke-width="1.4"/><text x="940.0" y="461.4" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="bold" fill="#111111" text-anchor="middle">Evaluate once</text><text x="940.0" y="474.4" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">on the untouched 20% test split;</text><text x="940.0" y="487.4" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">ROC-AUC / PR-AUC / recall / F1 for</text><text x="940.0" y="500.4" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">classifiers, MAE / RMSE / R2 for the regressor</text><rect x="730.0" y="534.0" width="420.0" height="82.0" rx="3" fill="#FFFFFF" stroke="#111111" stroke-width="1.4"/><text x="940.0" y="559.4" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="bold" fill="#111111" text-anchor="middle">Persist</text><text x="940.0" y="572.4" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">joblib pipeline + metrics.json +</text><text x="940.0" y="585.4" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">feature_contract.json + evaluation plots,</text><text x="940.0" y="598.4" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">all timestamped and versioned</text><rect x="50.0" y="664.0" width="640.0" height="100.0" rx="3" fill="#F4F4F4" stroke="#111111" stroke-width="1.4"/><text x="370.0" y="698.4" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="bold" fill="#111111" text-anchor="middle">TUNED THRESHOLDS PERSISTED WITH THE ARTEFACTS</text><text x="370.0" y="711.4" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">In HR the costly error is the false negative, so the threshold is chosen for recall on the minority class,</text><text x="370.0" y="724.4" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">not left at 0.5. Attrition lands at 0.2887 (recall 0.617 on leavers at 0.403 precision);</text><text x="370.0" y="737.4" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">promotion lands at 0.8347 (recall 0.635 at 0.615 precision). Both thresholds ship inside metrics.json.</text><path d="M 730.0 664.0 H 1138.0 L 1150.0 676.0 V 764.0 H 730.0 Z" fill="#F4F4F4" stroke="#111111" stroke-width="1.0"/><path d="M 1138.0 664.0 V 676.0 H 1150.0" fill="none" stroke="#111111" stroke-width="1.0"/><text x="940.0" y="685.4" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="bold" fill="#111111" text-anchor="middle">FAIRNESS IS IN THE DATA CONTRACT</text><text x="940.0" y="698.4" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">Gender, marital status, business travel and all survey-only</text><text x="940.0" y="711.4" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">satisfaction scores are excluded at TRAINING time. That cost about</text><text x="940.0" y="724.4" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">0.06 ROC-AUC and bought an input contract that matches live ERP data</text><text x="940.0" y="737.4" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">and is defensible. The serving side reinforces it with a</text><text x="940.0" y="750.4" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">PROTECTED_FEATURES set that is never surfaced as a decision factor.</text><path d="M 312.0 140.0 L 328.0 140.0" fill="none" stroke="#111111" stroke-width="1.4"/><polygon points="328.0,140.0 319.0,145.4 319.0,134.6" fill="#111111" stroke="none" stroke-width="1.4"/><path d="M 590.0 140.0 L 606.0 140.0" fill="none" stroke="#111111" stroke-width="1.4"/><polygon points="606.0,140.0 597.0,145.4 597.0,134.6" fill="#111111" stroke="none" stroke-width="1.4"/><path d="M 868.0 140.0 L 884.0 140.0" fill="none" stroke="#111111" stroke-width="1.4"/><polygon points="884.0,140.0 875.0,145.4 875.0,134.6" fill="#111111" stroke="none" stroke-width="1.4"/><path d="M 210.0 336.0 L 210.0 347.0 L 370.0 347.0 L 370.0 358.0" fill="none" stroke="#111111" stroke-width="1.4"/><polygon points="370.0,358.0 364.6,349.0 375.4,349.0" fill="#111111" stroke="none" stroke-width="1.4"/><path d="M 520.0 336.0 L 520.0 347.0 L 370.0 347.0 L 370.0 358.0" fill="none" stroke="#111111" stroke-width="1.4"/><polygon points="370.0,358.0 364.6,349.0 375.4,349.0" fill="#111111" stroke="none" stroke-width="1.4"/><path d="M 370.0 400.0 L 370.0 414.0" fill="none" stroke="#111111" stroke-width="1.4"/><polygon points="370.0,414.0 364.6,405.0 375.4,405.0" fill="#111111" stroke="none" stroke-width="1.4"/><path d="M 1015.0 188.0 L 1015.0 224.0 L 210.0 224.0 L 210.0 260.0" fill="none" stroke="#111111" stroke-width="1.4"/><polygon points="210.0,260.0 204.6,251.0 215.4,251.0" fill="#111111" stroke="none" stroke-width="1.4"/><path d="M 670.0 437.0 L 700.0 437.0 L 700.0 281.0 L 730.0 281.0" fill="none" stroke="#111111" stroke-width="1.4"/><polygon points="730.0,281.0 721.0,286.4 721.0,275.6" fill="#111111" stroke="none" stroke-width="1.4"/><path d="M 940.0 322.0 L 940.0 338.0" fill="none" stroke="#111111" stroke-width="1.4"/><polygon points="940.0,338.0 934.6,329.0 945.4,329.0" fill="#111111" stroke="none" stroke-width="1.4"/><path d="M 940.0 420.0 L 940.0 436.0" fill="none" stroke="#111111" stroke-width="1.4"/><polygon points="940.0,436.0 934.6,427.0 945.4,427.0" fill="#111111" stroke="none" stroke-width="1.4"/><path d="M 940.0 518.0 L 940.0 534.0" fill="none" stroke="#111111" stroke-width="1.4"/><polygon points="940.0,534.0 934.6,525.0 945.4,525.0" fill="#111111" stroke="none" stroke-width="1.4"/><rect x="50.0" y="500.0" width="640.0" height="138.0" rx="4" fill="#F4F4F4" stroke="#111111" stroke-width="1.0"/><text x="64.0" y="522.0" font-family="Consolas, 'Courier New', monospace" font-size="10" font-weight="normal" fill="#111111" text-anchor="start">Why the pipeline is the deployment artefact, not just a training convenience:</text><text x="64.0" y="537.0" font-family="Consolas, 'Courier New', monospace" font-size="10" font-weight="normal" fill="#111111" text-anchor="start"></text><text x="64.0" y="552.0" font-family="Consolas, 'Courier New', monospace" font-size="10" font-weight="normal" fill="#111111" text-anchor="start">  * the IMPUTERS ARE FITTED INSIDE it, so the service can accept a feature</text><text x="64.0" y="567.0" font-family="Consolas, 'Courier New', monospace" font-size="10" font-weight="normal" fill="#111111" text-anchor="start">    dictionary with holes and the pipeline fills them itself;</text><text x="64.0" y="582.0" font-family="Consolas, 'Courier New', monospace" font-size="10" font-weight="normal" fill="#111111" text-anchor="start">  * handle_unknown='ignore' NEUTRALISES an unseen category (a department name</text><text x="64.0" y="597.0" font-family="Consolas, 'Courier New', monospace" font-size="10" font-weight="normal" fill="#111111" text-anchor="start">    the model never met) rather than raising - a safe failure, but a silent one;</text><text x="64.0" y="612.0" font-family="Consolas, 'Courier New', monospace" font-size="10" font-weight="normal" fill="#111111" text-anchor="start">  * the exact column order is preserved, so a partial input is aligned, not</text><text x="64.0" y="627.0" font-family="Consolas, 'Courier New', monospace" font-size="10" font-weight="normal" fill="#111111" text-anchor="start">    positionally misread.</text><text x="64.0" y="244.0" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="bold" fill="#5A5A5A" text-anchor="start">THE SHARED scikit-learn PIPELINE  (fitted on TRAIN only)</text></svg>