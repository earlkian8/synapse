 description</text><rect x="300.0" y="196.0" width="356.0" height="84.0" rx="8" fill="#FFFFFF" stroke="#111111" stroke-width="1.4"/><path d="M 300.0 214.0 L 656.0 214.0" fill="none" stroke="#111111" stroke-width="1.0"/><text x="478.0" y="209.5" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="bold" fill="#111111" text-anchor="middle">7.2</text><text x="478.0" y="237.7" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="normal" fill="#111111" text-anchor="middle">Derive programme status</text><text x="478.0" y="250.7" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">completed once the end date passes,</text><text x="478.0" y="263.7" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">ongoing once the start date arrives</text><rect x="300.0" y="300.0" width="356.0" height="84.0" rx="8" fill="#FFFFFF" stroke="#111111" stroke-width="1.4"/><path d="M 300.0 318.0 L 656.0 318.0" fill="none" stroke="#111111" stroke-width="1.0"/><text x="478.0" y="313.5" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="bold" fill="#111111" text-anchor="middle">7.3</text><text x="478.0" y="341.7" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="normal" fill="#111111" text-anchor="middle">Enrol, individually or in bulk</text><text x="478.0" y="354.7" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">enrolling into a full programme is</text><text x="478.0" y="367.7" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">blocked, not silently queued</text><rect x="300.0" y="404.0" width="356.0" height="84.0" rx="8" fill="#FFFFFF" stroke="#111111" stroke-width="1.4"/><path d="M 300.0 422.0 L 656.0 422.0" fill="none" stroke="#111111" stroke-width="1.0"/><text x=