="normal" fill="#5A5A5A" text-anchor="middle">what is working, concerns, recommendations,</text><text x="478.0" y="679.7" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">and who to follow up with</text><rect x="300.0" y="716.0" width="356.0" height="84.0" rx="8" fill="#FFFFFF" stroke="#111111" stroke-width="1.4"/><path d="M 300.0 734.0 L 656.0 734.0" fill="none" stroke="#111111" stroke-width="1.0"/><text x="478.0" y="729.5" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="bold" fill="#111111" text-anchor="middle">7.7</text><text x="478.0" y="757.7" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="normal" fill="#111111" text-anchor="middle">Emit the growth signal</text><text x="478.0" y="770.7" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">completions in the last 12 months feed</text><text x="478.0" y="783.7" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">the awards board and the ML features</text><rect x="740.0" y="210.0" width="268.0" height="56.0" rx="0" fill="#FFFFFF" stroke="#111111" stroke-width="1.4"/><path d="M 766.0 210.0 L 766.0 266.0" fill="none" stroke="#111111" stroke-width="1.0"/><text x="753.0" y="241.5" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="bold" fill="#111111" text-anchor="middle">D7.1</text><text x="887.0" y="235.0" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="normal" fill="#111111" text-anchor="middle">training_programs</text><text x="887.0" y="248.0" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">with ai_insights</text><rect x="740.0" y="418.0" width="268.0" height="56.0" rx="0" fill="#FFFFFF" stroke="#111111" stroke-width="1.4"/><path d="M 766.0 418.0 L 766.0 474.0" fill="none" 