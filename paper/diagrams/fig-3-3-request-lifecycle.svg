.9" y="134.6" width="36.2" height="13.7" rx="2" fill="#FFFFFF" stroke="none" stroke-width="0"/><text x="806.0" y="144.5" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="normal" fill="#111111" text-anchor="middle">denied</text><text x="560.0" y="630.0" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="normal" fill="#5A5A5A" text-anchor="middle">Isolation holds regardless of permission: the tenant filter is applied one level below the query, before authorization is ever consulted,</text><text x="560.0" y="646.0" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="normal" fill="#5A5A5A" text-anchor="middle">so even a company's most privileged user cannot read another company's rows.</text></svg>