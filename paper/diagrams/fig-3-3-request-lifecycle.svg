<svg xmlns="http://www.w3.org/2000/svg" width="1146" height="700" viewBox="0 0 1146 700"><rect x="0.0" y="0.0" width="1146.0" height="700.0" rx="0" fill="#FFFFFF" stroke="none" stroke-width="0"/><text x="573.0" y="28.0" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#111111" text-anchor="middle">Figure 3.3  Request Lifecycle and the Enforcement Pipeline</text><text x="573.0" y="46.0" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#5A5A5A" text-anchor="middle">The fixed order of the four gates: identity, tenancy, authorization, then audit</text><rect x="70.0" y="110.0" width="200.0" height="118.0" rx="3" fill="#FFFFFF" stroke="#111111" stroke-width="1.4"/><text x="170.0" y="153.3" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#111111" text-anchor="middle">Request</text><text x="170.0" y="166.3" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="normal" fill="#5A5A5A" text-anchor="middle">HTTP request</text><text x="170.0" y="179.3" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="normal" fill="#5A5A5A" text-anchor="middle">(web session or</text><text x="170.0" y="192.3" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="normal" fill="#5A5A5A" text-anchor="middle">Bearer token)</text><rect x="282.0" y="110.0" width="200.0" height="118.0" rx="3" fill="#F4F4F4" stroke="#111111" stroke-width="1.4"/><text x="382.0" y="153.3" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#111111" text-anchor="middle">1  IDENTITY</text><text x="382.0" y="166.3" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="normal" fill="#5A5A5A" text-anchor="middle">Fortify / Sanctum</text><text x="382.0" y="179.3" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="normal" fill="#5A5A5A" text-anchor="middle">resolves the User;</text><text x="382.0" y="192.3" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="normal" fill="#5A5A5A" text-anchor="middle">2FA + passkey optional</text><rect x="494.0" y="110.0" width="200.0" height="118.0" rx="3" fill="#E4E4E4" stroke="#111111" stroke-width="1.4"/><text x="594.0" y="153.3" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#111111" text-anchor="middle">2  TENANCY</text><text x="594.0" y="166.3" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="normal" fill="#5A5A5A" text-anchor="middle">SetCurrentOrganization</text><text x="594.0" y="179.3" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="normal" fill="#5A5A5A" text-anchor="middle">resolves the active org</text><text x="594.0" y="192.3" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="normal" fill="#5A5A5A" text-anchor="middle">and validates membership</text><rect x="706.0" y="110.0" width="200.0" height="118.0" rx="3" fill="#F4F4F4" stroke="#111111" stroke-width="1.4"/><text x="806.0" y="153.3" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#111111" text-anchor="middle">3  AUTHORIZATION</text><text x="806.0" y="166.3" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="normal" fill="#5A5A5A" text-anchor="middle">can:&lt;ability&gt; route gate</text><text x="806.0" y="179.3" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="normal" fill="#5A5A5A" text-anchor="middle">+ policy checks against</text><text x="806.0" y="192.3" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="normal" fill="#5A5A5A" text-anchor="middle">the 73-permission registry</text><rect x="918.0" y="110.0" width="200.0" height="118.0" rx="3" fill="#FFFFFF" stroke="#111111" stroke-width="1.4"/><text x="1018.0" y="153.3" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#111111" text-anchor="middle">4  VAL