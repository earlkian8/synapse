roke-width="1.4"/><text x="530.0" y="553.4" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#111111" text-anchor="middle">Redirect / Inertia response</text><text x="530.0" y="566.4" font-family="Arial, Helvetica, sans-serif" font-size="8.7" font-weight="normal" fill="#5A5A5A" text-anchor="middle">+ SecurityHeaders (CSP w/ nonce, nosniff, X-Frame-Options)</text><rect x="780.0" y="130.0" width="260.0" height="78.0" rx="3" fill="#FFFFFF" stroke="#111111" stroke-width="1.4" stroke-dasharray="6 4"/><text x="910.0" y="153.3" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#111111" text-anchor="middle">403 / redirect to switcher</text><text x="910.0" y="166.3" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">a correctly authenticated user still</text><text x="910.0" y="179.3" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">cannot enter an organisation they</text><text x="910.0" y="192.3" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">are not a member of</text><path d="M 270.0 169.0 L 282.0 169.0" fill="none" stroke="#111111" stroke-width="1.4"/><polygon points="282.0,169.0 273.0,174.4 273.0,163.6" fill="#111111" stroke="none" stroke-width="1.4"/><path d="M 482.0 169.0 L 494.0 169.0" fill="none" stroke="#111111" stroke-width="1.4"/><polygon points="494.0,169.0 485.0,174.4 485.0,163.6" fill="#111111" stroke="none" stroke-width="1.4"/><path d="M 694.0 169.0 L 706.0 169.0" fill="none" stroke="#111111" stroke-width="1.4"/><polygon points="706.0,169.0 697.0,174.4 697.0,163.6" fill="#111111" stroke="none" stroke-width="1.4"/><path d="M 906.0 169.0 L 918.0 169.0" fill="none" stroke="#111111" stroke-width="1.4"/><polygon points="918.0,169.0 909.0,174.4 909.0,163.6" fill="#111111" stroke="none" stroke-width="1.4"/><path