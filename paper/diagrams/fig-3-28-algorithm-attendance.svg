<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="780" viewBox="0 0 1120 780"><rect x="0.0" y="0.0" width="1120.0" height="780.0" rx="0" fill="#FFFFFF" stroke="none" stroke-width="0"/><text x="560.0" y="28.0" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#111111" text-anchor="middle">Figure 3.28  Decision-Support Algorithm - Attendance Derivation</text><text x="560.0" y="46.0" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#5A5A5A" text-anchor="middle">AttendanceCalculator: two tables, one calculator, and a state machine over the punch stream</text><rect x="50.0" y="92.0" width="300.0" height="120.0" rx="3" fill="#F4F4F4" stroke="#111111" stroke-width="1.4"/><text x="200.0" y="129.8" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#111111" text-anchor="middle">attendance_punches  (raw, append-only)</text><text x="200.0" y="142.8" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">clock_in - clock_out - break_start - break_end</text><text x="200.0" y="155.8" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">each with timestamp, source (web / mobile /</text><text x="200.0" y="168.8" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">kiosk / biometric / manual), GPS, optional</text><text x="200.0" y="181.8" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">selfie, and who recorded it</text><rect x="50.0" y="236.0" width="300.0" height="108.0" rx="3" fill="#F4F4F4" stroke="#111111" stroke-width="1.4"/><text x="200.0" y="274.4" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#111111" text-anchor="middle">attendance_records  (derived, one per day)</text><text x="200.0" y="287.4" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">worked / break / late / undertime / overtime</text><text x="200.0" y="300.4" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">minutes, status, and a SNAPSHOT of the</text><text x="200.0" y="313.4" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">schedule that applied that day</text><path d="M 50.0 380.0 H 338.0 L 350.0 392.0 V 540.0 H 50.0 Z" fill="#F4F4F4" stroke="#111111" stroke-width="1.0"/><path d="M 338.0 380.0 V 392.0 H 350.0" fill="none" stroke="#111111" stroke-width="1.0"/><text x="200.0" y="405.4" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="bold" fill="#111111" text-anchor="middle">THREE DESIGN DECISIONS</text><text x="200.0" y="418.4" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">1. Arithmetic runs on UNIX timestamps,</text><text x="200.0" y="431.4" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">   so it is agnostic to mutable vs</text><text x="200.0" y="444.4" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">   immutable date objects.</text><text x="200.0" y="457.4" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">2. Leave awareness reuses the leave</text><text x="200.0" y="470.4" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">   module's own coverage check, so an</text><text x="200.0" y="483.4" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">   approved leave day is never absent.</text><text x="200.0" y="496.4" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">3. The roster is built from EVERY</text><text x="200.0" y="509.4" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">   employee, so a person with no</text><text x="200.0" y="522.4" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">   punches appears, never vanishes.</text><path d="M 50.0 566.0 H 338.0 L 350.0 578.0 V 696.0 H 50.0 Z" fill="#F4F4F4" stroke="#111111" stroke-width="1.0"/><path d="M 338.0 566.0 V 578.0 H 350.0" fill="none" stroke="#111111" stroke-width="1.0"/><text x="200.0" y="595.9" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="bold" fill="#111111" text-anchor="middle">ONE CANONICAL WRITER</text><text x="200.0" y="608.9" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">AttendanceClock is the only path that</text><text x="200.0" y="621.9" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">ever writes a punch. The web screen,</text><text x="200.0" y="634.9" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">the mobile API and the AI assistant</text><text x="200.0" y="647.9" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">all call it, so a punch made on a</text><text x="200.0" y="660.9" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">phone computes identically to one made</text><text x="200.0" y="673.9" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">at a desktop.</text><path d="M 200.0 212.0 L 200.0 236.0" fill="none" stroke="#111111" stroke-width="1.4"/><polygon points="200.0,236.0 194.6,227.0 205.4,227.0" fill="#111111" stroke="none" stroke-width="1.4"/><rect x="400.0" y="120.0" width="670.0" height="153.0" rx="4" fill="#F4F4F4" stroke="#111111" stroke-width="1.0"/><text x="414.0" y="142.0" font-family="Consolas, 'Courier New', monospace" font-size="10" font-weight="normal" fill="#111111" text-anchor="start">on_clock = false ; on_break = false ; worked = 0 ; break = 0</text><text x="414.0" y="157.0" font-family="Consolas, 'Courier New', monospace" font-size="10" font-weight="normal" fill="#111111" text-anchor="start">for each punch, in order:</text><text x="414.0" y="172.0" font-family="Consolas, 'Courier New', monospace" font-size="10" font-weight="normal" fill="#111111" text-anchor="start">    delta = minutes since the previous punch</text><text x="414.0" y="187.0" font-family="Consolas, 'Courier New', monospace" font-size="10" font-weight="normal" fill="#111111" text-anchor="start">    if on_clock and on_break :  break  += delta</text><text x="414.0" y="202.0" font-family="Consolas, 'Courier New', monospace" font-size="10" font-weight="normal" fill="#111111" text-anchor="start">    elif on_clock            :  worked += delta</text><text x="414.0" y="217.0" font-family="Consolas, 'Courier New', monospace" font-size="10" font-weight="normal" fill="#111111" text-anchor="start">    clock_in    -&gt; on_clock = true</text><text x="414.0" y="232.0" font-family="Consolas, 'Courier New', monospace" font-size="10" font-weight="normal" fill="#111111" text-anchor="start">    clock_out   -&gt; on_clock = false ; on_break = false</text><text x="414.0" y="247.0" font-family="Consolas, 'Courier New', monospace" font-size="10" font-weight="normal" fill="#111111" text-anchor="start">    break_start -&gt; on_break = true</text><text x="414.0" y="262.0" font-family="Consolas, 'Courier New', monospace" font-size="10" font-weight="normal" fill="#111111" text-anchor="start">    break_end   -&gt; on_break = false</text><rect x="400.0" y="289.0" width="670.0" height="63.0" rx="4" fill="#F4F4F4" stroke="#111111" stroke-width="1.0"/><text x="414.0" y="311.0" font-family="Consolas, 'Courier New', monospace" font-size="10" font-weight="normal" fill="#111111" text-anchor="start">late_minutes      = max(0, first_in - (scheduled_start + grace_minutes))</text><text x="414.0" y="326.0" font-family="Consolas, 'Courier New', monospace" font-size="10" font-weight="normal" fill="#111111" text-anchor="start">undertime_minutes = max(0, scheduled_end - last_out)      when they left early</text><text x="414.0" y="341.0" font-family="Consolas, 'Courier New', monospace" font-size="10" font-weight="normal" fill="#111111" text-anchor="start">overtime_minutes  = max(0, worked - required_hours x 60)</text><rect x="400.0" y="404.0" width="670.0" height="123.0" rx="4" fill="#E4E4E4" stroke="#111111" stroke-width="1.0"/><text x="414.0" y="426.0" font-family="Consolas, 'Courier New', monospace" font-size="10" font-weight="normal" fill="#111111" text-anchor="start">no punches and an approved leave covers the day  -&gt;  on_leave</text><text x="414.0" y="441.0" font-family="Consolas, 'Courier New', monospace" font-size="10" font-weight="normal" fill="#111111" text-anchor="start">no punches and the weekday is not in work_days   -&gt;  day_off</text><text x="414.0" y="456.0" font-family="Consolas, 'Courier New', monospace" font-size="10" font-weight="normal" fill="#111111" text-anchor="start">no punches otherwise                             -&gt;  absent</text><text x="414.0" y="471.0" font-family="Consolas, 'Courier New', monospace" font-size="10" font-weight="normal" fill="#111111" text-anchor="start">clocked in but never out                         -&gt;  incomplete</text><text x="414.0" y="486.0" font-family="Consolas, 'Courier New', monospace" font-size="10" font-weight="normal" fill="#111111" text-anchor="start">late_minutes &gt; 0                                 -&gt;  late</text><text x="414.0" y="501.0" font-family="Consolas, 'Courier New', monospace" font-size="10" font-weight="normal" fill="#111111" text-anchor="start">undertime_minutes &gt; 0                            -&gt;  undertime</text><text x="414.0" y="516.0" font-family="Consolas, 'Courier New', monospace" font-size="10" font-weight="normal" fill="#111111" text-anchor="start">otherwise                                        -&gt;  present</text><rect x="400.0" y="543.0" width="670.0" height="33.0" rx="4" fill="#F4F4F4" stroke="#111111" stroke-width="1.0"/><text x="414.0" y="565.0" font-family="Consolas, 'Courier New', monospace" font-size="10" font-weight="normal" fill="#111111" text-anchor="start">attendance_rate = present days / scheduled days x 100     (null when nothing was scheduled)</text><rect x="169.3" y="208.1" width="61.4" height="13.7" rx="2" fill="#FFFFFF" stroke="none" stroke-width="0"/><text x="200.0" y="218.0" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="normal" fill="#111111" text-anchor="middle">recompute()</text><text x="400.0" y="108.0" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="bold" fill="#111111" text-anchor="start">THE STATE MACHINE  (walk the punches in chronological order)</text><text x="400.0" y="392.0" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="bold" fill="#111111" text-anchor="start">STATUS RESOLUTION  (first match wins)</text></svg>