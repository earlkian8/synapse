<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="953" viewBox="0 0 1120 953"><rect x="0.0" y="0.0" width="1120.0" height="953.0" rx="0" fill="#FFFFFF" stroke="none" stroke-width="0"/><text x="560.0" y="28.0" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#111111" text-anchor="middle">Figure 3.22  Flowchart - The Hire Bridge (Recruitment to Workforce)</text><text x="560.0" y="46.0" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#5A5A5A" text-anchor="middle">One database transaction converts a candidate into an employee; identity is issued separately</text><rect x="180.0" y="262.0" width="580.0" height="320.0" rx="8" fill="#FFFFFF" stroke="#111111" stroke-width="1.4" stroke-dasharray="6 4"/><rect x="235.0" y="84.0" width="470.0" height="36.0" rx="18.0" fill="#F4F4F4" stroke="#111111" stroke-width="1.4"/><text x="470.0" y="105.8" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#111111" text-anchor="middle">START  -  HR presses Hire on an application at the OFFER stage</text><polygon points="470.0,150.0 620.0,189.0 470.0,228.0 320.0,189.0" fill="#FFFFFF" stroke="#111111" stroke-width="1.4"/><text x="470.0" y="186.3" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#111111" text-anchor="middle">Already hired?</text><text x="470.0" y="199.3" font-family="Arial, Helvetica, sans-serif" font-size="8.7" font-weight="normal" fill="#5A5A5A" text-anchor="middle">hired_employee_id is not null</text><rect x="830.0" y="152.0" width="250.0" height="58.0" rx="3" fill="#FFFFFF" stroke="#111111" stroke-width="1.4" stroke-dasharray="6 4"/><text x="955.0" y="178.3" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#111111" text-anchor="middle">Reject the action</text><text x="955.0" y="191.3" font-family="Arial, Helvetica, sans-serif" font-size="8.7" font-weight="normal" fill="#5A5A5A" text-anchor="middle">a hired candidate can never be un-hired</text><rect x="200.0" y="294.0" width="540.0" height="52.0" rx="12" fill="#FFFFFF" stroke="#111111" stroke-width="1.4"/><text x="470.0" y="317.4" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#111111" text-anchor="middle">Create the employee record</text><text x="470.0" y="330.4" font-family="Arial, Helvetica, sans-serif" font-size="8.7" font-weight="normal" fill="#5A5A5A" text-anchor="middle">EmployeeNumbers::next() issues EMP-NNNNN - never max(id)+1</text><rect x="200.0" y="356.0" width="540.0" height="52.0" rx="12" fill="#FFFFFF" stroke="#111111" stroke-width="1.4"/><text x="470.0" y="379.4" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#111111" text-anchor="middle">Copy the resume into the new 201 file</text><text x="470.0" y="392.4" font-family="Arial, Helvetica, sans-serif" font-size="8.7" font-weight="normal" fill="#5A5A5A" text-anchor="middle">private disk, access-logged from the first read</text><rect x="200.0" y="418.0" width="540.0" height="52.0" rx="12" fill="#FFFFFF" stroke="#111111" stroke-width="1.4"/><text x="470.0" y="441.4" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#111111" text-anchor="middle">Seed onboarding from the best-matching programme</text><text x="470.0" y="454.4" font-family="Arial, Helvetica, sans-serif" font-size="8.7" font-weight="normal" fill="#5A5A5A" text-anchor="middle">OnboardingProvisioner::start() - dept+type &gt; dept &gt; type &gt; default</text><rect x="200.0" y="480.0" width="540.0" height="52.0" rx="12" fill="#FFFFFF" stroke="#111111" stroke-width="1.4"/><text x="470.0" y="509.9" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#111111" text-anchor="middle">Mark the application HIRED and link it to the employee</text><rect x="200.0" y="542.0" width="540.0" height="52.0" rx="12" fill="#FFFFFF" stroke="#111111" stroke-width="1.4"/><text x="470.0" y="565.4" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#111111" text-anchor="middle">Fill the posting when its openings are met</text><text x="470.0" y="578.4" font-family="Arial, Helvetica, sans-serif" font-size="8.7" font-weight="normal" fill="#5A5A5A" text-anchor="middle">status open -&gt; filled</text><rect x="300.0" y="608.0" width="340.0" height="52.0" rx="12" fill="#FFFFFF" stroke="#111111" stroke-width="1.4"/><text x="470.0" y="631.4" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#111111" text-anchor="middle">Commit; queue side effects AFTER commit</text><text x="470.0" y="644.4" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">nothing fires on a rolled-back hire</text><rect x="280.0" y="690.0" width="380.0" height="68.0" rx="12" fill="#F4F4F4" stroke="#111111" stroke-width="1.4"/><text x="470.0" y="714.9" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#111111" text-anchor="middle">Issue an app invitation to the new hire</text><text x="470.0" y="727.9" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">hashed link token + retypeable 8-character code;</text><text x="470.0" y="740.9" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">hiring creates EMPLOYMENT, never a login (ADR 0026)</text><rect x="830.0" y="690.0" width="260.0" height="68.0" rx="3" fill="#FFFFFF" stroke="#111111" stroke-width="1.4" stroke-dasharray="6 4"/><text x="960.0" y="708.4" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#111111" text-anchor="middle">The person claims the seat</text><text x="960.0" y="721.4" font-family="Arial, Helvetica, sans-serif" font-size="8.7" font-weight="normal" fill="#5A5A5A" text-anchor="middle">registers their own identity, then</text><text x="960.0" y="734.4" font-family="Arial, Helvetica, sans-serif" font-size="8.7" font-weight="normal" fill="#5A5A5A" text-anchor="middle">redeems the code; both paths converge</text><text x="960.0" y="747.4" font-family="Arial, Helvetica, sans-serif" font-size="8.7" font-weight="normal" fill="#5A5A5A" text-anchor="middle">on OrganizationProvisioner::admit()</text><rect x="390.0" y="794.0" width="160.0" height="36.0" rx="18.0" fill="#F4F4F4" stroke="#111111" stroke-width="1.4"/><text x="470.0" y="815.9" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#111111" text-anchor="middle">END</text><path d="M 70.0 348.0 H 298.0 L 310.0 360.0 V 466.0 H 70.0 Z" fill="#F4F4F4" stroke="#111111" stroke-width="1.0"/><path d="M 298.0 348.0 V 360.0 H 310.0" fill="none" stroke="#111111" stroke-width="1.0"/><text x="190.0" y="378.4" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="bold" fill="#111111" text-anchor="middle">WHY ONE TRANSACTION</text><text x="190.0" y="391.4" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">The five writes are mutually</text><text x="190.0" y="404.4" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">dependent: an employee with no</text><text x="190.0" y="417.4" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">onboarding case, or an application</text><text x="190.0" y="430.4" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">marked hired with no employee,</text><text x="190.0" y="443.4" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">would each be a silent data fault.</text><path d="M 470.0 120.0 L 470.0 150.0" fill="none" stroke="#111111" stroke-width="1.4"/><polygon points="470.0,150.0 464.6,141.0 475.4,141.0" fill="#111111" stroke="none" stroke-width="1.4"/><path d="M 620.0 189.0 L 725.0 189.0 L 725.0 181.0 L 830.0 181.0" fill="none" stroke="#111111" stroke-width="1.4" stroke-dasharray="6 4"/><polygon points="830.0,181.0 821.0,186.4 821.0,175.6" fill="#111111" stroke="none" stroke-width="1.4"/><path d="M 470.0 228.0 L 470.0 294.0" fill="none" stroke="#111111" stroke-width="1.4"/><polygon points="470.0,294.0 464.6,285.0 475.4,285.0" fill="#111111" stroke="none" stroke-width="1.4"/><path d="M 470.0 346.0 L 470.0 356.0" fill="none" stroke="#111111" stroke-width="1.4"/><polygon points="470.0,356.0 464.6,347.0 475.4,347.0" fill="#111111" stroke="none" stroke-width="1.4"/><path d="M 470.0 408.0 L 470.0 418.0" fill="none" stroke="#111111" stroke-width="1.4"/><polygon points="470.0,418.0 464.6,409.0 475.4,409.0" fill="#111111" stroke="none" stroke-width="1.4"/><path d="M 470.0 470.0 L 470.0 480.0" fill="none" stroke="#111111" stroke-width="1.4"/><polygon points="470.0,480.0 464.6,471.0 475.4,471.0" fill="#111111" stroke="none" stroke-width="1.4"/><path d="M 470.0 532.0 L 470.0 542.0" fill="none" stroke="#111111" stroke-width="1.4"/><polygon points="470.0,542.0 464.6,533.0 475.4,533.0" fill="#111111" stroke="none" stroke-width="1.4"/><path d="M 470.0 228.0 L 470.0 294.0" fill="none" stroke="#111111" stroke-width="1.4"/><polygon points="470.0,294.0 464.6,285.0 475.4,285.0" fill="#111111" stroke="none" stroke-width="1.4"/><path d="M 470.0 594.0 L 470.0 608.0" fill="none" stroke="#111111" stroke-width="1.4"/><polygon points="470.0,608.0 464.6,599.0 475.4,599.0" fill="#111111" stroke="none" stroke-width="1.4"/><path d="M 470.0 660.0 L 470.0 690.0" fill="none" stroke="#111111" stroke-width="1.4"/><polygon points="470.0,690.0 464.6,681.0 475.4,681.0" fill="#111111" stroke="none" stroke-width="1.4"/><path d="M 660.0 724.0 L 830.0 724.0" fill="none" stroke="#111111" stroke-width="1.4" stroke-dasharray="6 4"/><polygon points="830.0,724.0 821.0,729.4 821.0,718.6" fill="#111111" stroke="none" stroke-width="1.4"/><path d="M 470.0 758.0 L 470.0 794.0" fill="none" stroke="#111111" stroke-width="1.4"/><polygon points="470.0,794.0 464.6,785.0 475.4,785.0" fill="#111111" stroke="none" stroke-width="1.4"/><rect x="714.4" y="169.1" width="21.1" height="13.7" rx="2" fill="#FFFFFF" stroke="none" stroke-width="0"/><text x="725.0" y="179.0" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="normal" fill="#111111" text-anchor="middle">Yes</text><text x="196.0" y="282.0" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="bold" fill="#5A5A5A" text-anchor="start">ONE DATABASE TRANSACTION  (ApplicantHirer::hire)</text><rect x="462.0" y="245.1" width="16.1" height="13.7" rx="2" fill="#FFFFFF" stroke="none" stroke-width="0"/><text x="470.0" y="255.0" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="normal" fill="#111111" text-anchor="middle">No</text><text x="830.0" y="836.0" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="bold" fill="#111111" text-anchor="start">LEGEND</text><rect x="830.0" y="842.0" width="22.0" height="12.0" rx="6" fill="#FFFFFF" stroke="#111111" stroke-width="1.0"/><text x="860.0" y="851.5" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="normal" fill="#5A5A5A" text-anchor="start">process / action</text><polygon points="841.0,858.0 852.0,865.0 841.0,872.0 830.0,865.0" fill="#FFFFFF" stroke="#111111" stroke-width="1.0"/><text x="860.0" y="868.5" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="normal" fill="#5A5A5A" text-anchor="start">decision</text><rect x="830.0" y="876.0" width="22.0" height="12.0" rx="2" fill="#FFFFFF" stroke="#111111" stroke-width="1.0"/><text x="860.0" y="885.5" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="normal" fill="#5A5A5A" text-anchor="start">terminator / data</text><path d="M 830.0 899.0 L 852.0 899.0" fill="none" stroke="#111111" stroke-width="1.4"/><polygon points="852.0,899.0 843.0,904.4 843.0,893.6" fill="#111111" stroke="none" stroke-width="1.4"/><text x="860.0" y="902.5" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="normal" fill="#5A5A5A" text-anchor="start">control flow</text><path d="M 830.0 916.0 L 852.0 916.0" fill="none" stroke="#111111" stroke-width="1.4" stroke-dasharray="6 4"/><polygon points="852.0,916.0 843.0,921.4 843.0,910.6" fill="#111111" stroke="none" stroke-width="1.4"/><text x="860.0" y="919.5" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="normal" fill="#5A5A5A" text-anchor="start">loop / degraded path</text></svg>