<svg xmlns="http://www.w3.org/2000/svg" width="1228" height="880" viewBox="0 0 1228 880"><rect x="0.0" y="0.0" width="1228.0" height="880.0" rx="0" fill="#FFFFFF" stroke="none" stroke-width="0"/><text x="614.0" y="28.0" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#111111" text-anchor="middle">Figure 3.36  Information Architecture and Navigation Map</text><text x="614.0" y="46.0" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#5A5A5A" text-anchor="middle">Six sidebar groups on the web, five tabs on the phone; every item is hidden unless the viewer holds its permission</text><rect x="40.0" y="96.0" width="260.0" height="188.0" rx="6" fill="#FFFFFF" stroke="#111111" stroke-width="1.4"/><text x="52.0" y="118.0" font-family="Arial, Helvetica, sans-serif" font-size="9.6" font-weight="bold" fill="#5A5A5A" text-anchor="start">TALENT ACQUISITION</text><rect x="340.0" y="96.0" width="260.0" height="254.0" rx="6" fill="#FFFFFF" stroke="#111111" stroke-width="1.4"/><text x="352.0" y="118.0" font-family="Arial, Helvetica, sans-serif" font-size="9.6" font-weight="bold" fill="#5A5A5A" text-anchor="start">WORKFORCE</text><rect x="640.0" y="96.0" width="260.0" height="78.0" rx="6" fill="#FFFFFF" stroke="#111111" stroke-width="1.4"/><text x="652.0" y="118.0" font-family="Arial, Helvetica, sans-serif" font-size="9.6" font-weight="bold" fill="#5A5A5A" text-anchor="start">OFFBOARDING</text><rect x="640.0" y="220.0" width="260.0" height="144.0" rx="6" fill="#FFFFFF" stroke="#111111" stroke-width="1.4"/><text x="652.0" y="242.0" font-family="Arial, Helvetica, sans-serif" font-size="9.6" font-weight="bold" fill="#5A5A5A" text-anchor="start">ANALYTICS &amp; AI</text><rect x="940.0" y="96.0" width="260.0" height="232.0" rx="6" fill="#FFFFFF" stroke="#111111" stroke-width="1.4"/><text x="952.0" y="118.0" font-family="Arial, Helvetica, sans-serif" font-size="9.6" font-weight="bold" fill="#5A5A5A" text-anchor="start">COMPANY SETUP</text><rect x="940.0" y="356.0" width="260.0" height="122.0" rx="6" fill="#FFFFFF" stroke="#111111" stroke-width="1.4"/><text x="952.0" y="378.0" font-family="Arial, Helvetica, sans-serif" font-size="9.6" font-weight="bold" fill="#5A5A5A" text-anchor="start">SYSTEM</text><rect x="40.0" y="574.0" width="560.0" height="250.0" rx="6" fill="#FFFFFF" stroke="#111111" stroke-width="1.4" stroke-dasharray="6 4"/><rect x="40.0" y="340.0" width="260.0" height="56.0" rx="3" fill="#F4F4F4" stroke="#111111" stroke-width="1.4"/><text x="170.0" y="365.4" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="bold" fill="#111111" text-anchor="middle">/dashboard</text><text x="170.0" y="378.4" font-family="Arial, Helvetica, sans-serif" font-size="8.6" font-weight="normal" fill="#5A5A5A" text-anchor="middle">the landing surface once a workspace is chosen</text><rect x="40.0" y="412.0" width="260.0" height="56.0" rx="3" fill="#F4F4F4" stroke="#111111" stroke-width="1.4"/><text x="170.0" y="437.4" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="bold" fill="#111111" text-anchor="middle">/workspaces  picker + switcher</text><text x="170.0" y="450.4" font-family="Arial, Helvetica, sans-serif" font-size="8.6" font-weight="normal" fill="#5A5A5A" text-anchor="middle">skipped when the user belongs to exactly one</text><rect x="40.0" y="484.0" width="260.0" height="56.0" rx="3" fill="#FFFFFF" stroke="#111111" stroke-width="1.4" stroke-dasharray="6 4"/><text x="170.0" y="509.4" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="bold" fill="#111111" text-anchor="middle">/careers/{org-slug}</text><text x="170.0" y="522.4" font-family="Arial, Helvetica, sans-serif" font-size="8.6" font-weight="normal" fill="#5A5A5A" text-anchor="middle">public, outside the login entirely</text><path d="M 640.0 574.0 H 1188.0 L 1200.0 586.0 V 690.0 H 640.0 Z" fill="#F4F4F4" stroke="#111111" stroke-width="1.0"/><path d="M 1188.0 574.0 V 586.0 H 1200.0" fill="none" stroke="#111111" stroke-width="1.0"/><text x="920.0" y="609.9" font-family="Arial, Helvetica, sans-serif" font-size="9.6" font-weight="bold" fill="#111111" text-anchor="middle">PERMISSION-AWARE NAVIGATION</text><text x="920.0" y="622.9" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">A sidebar item is not merely disabled when the viewer lacks its permission - it is not rendered, and its route is</text><text x="920.0" y="635.9" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">gated independently, so hiding the link is a convenience rather than the control. Dashboard blocks follow the same</text><text x="920.0" y="648.9" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">rule: each is computed only when the viewer holds the matching *.view permission and is otherwise returned as null,</text><text x="920.0" y="661.9" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">so a Staff user receives an empty overview rather than figures they are not allowed to see.</text><path d="M 640.0 706.0 H 1188.0 L 1200.0 718.0 V 824.0 H 640.0 Z" fill="#F4F4F4" stroke="#111111" stroke-width="1.0"/><path d="M 1188.0 706.0 V 718.0 H 1200.0" fill="none" stroke="#111111" stroke-width="1.0"/><text x="920.0" y="742.9" font-family="Arial, Helvetica, sans-serif" font-size="9.6" font-weight="bold" fill="#111111" text-anchor="middle">WHAT DELIBERATELY IS NOT ON THE PHONE</text><text x="920.0" y="755.9" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">Creating a company, managing anyone else's record, running an assessment, or reading another employee's data.</text><text x="920.0" y="768.9" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">The mobile surface is self-scoped: every endpoint returns the caller's own data and needs no permission beyond</text><text x="920.0" y="781.9" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">the two the Staff role carries (attendance.clock and leave.request). It is a self-service companion with one hero</text><text x="920.0" y="794.9" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">feature, not a small copy of the ERP.</text><text x="56.0" y="140.0" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#111111" text-anchor="start">- /recruitment  postings + pipeline</text><text x="56.0" y="162.0" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#111111" text-anchor="start">- /recruitment/desk  my work</text><text x="56.0" y="184.0" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#111111" text-anchor="start">- /recruitment/candidates</text><text x="56.0" y="206.0" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#111111" text-anchor="start">- /recruitment/interviews</text><text x="56.0" y="228.0" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#111111" text-anchor="start">- /recruitment/analytics</text><text x="56.0" y="250.0" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#111111" text-anchor="start">- /onboarding  cases</text><text x="56.0" y="272.0" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#111111" text-anchor="start">- /onboarding/my-tasks</text><text x="356.0" y="140.0" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#111111" text-anchor="start">- /employees  directory + 201</text><text x="356.0" y="162.0" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#111111" text-anchor="start">- /employees/access  invitations</text><text x="356.0" y="184.0" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#111111" text-anchor="start">- /attendance  DTR board</text><text x="356.0" y="206.0" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#111111" text-anchor="start">- /attendance/me  self-service</text><text x="356.0" y="228.0" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#111111" text-anchor="start">- /leave  approvals inbox</text><text x="356.0" y="250.0" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#111111" text-anchor="start">- /leave/balances</text><text x="356.0" y="272.0" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#111111" text-anchor="start">- /performance  cycles</text><text x="356.0" y="294.0" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#111111" text-anchor="start">- /training</text><text x="356.0" y="316.0" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#111111" text-anchor="start">- /awards</text><text x="356.0" y="338.0" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#111111" text-anchor="start">- /events</text><text x="656.0" y="140.0" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#111111" text-anchor="start">- /offboarding  exits</text><text x="656.0" y="162.0" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#111111" text-anchor="start">- /offboarding/{case}  clearance</text><text x="656.0" y="264.0" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#111111" text-anchor="start">- /analytics/attrition</text><text x="656.0" y="286.0" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#111111" text-anchor="start">- /analytics/performance-forecast</text><text x="656.0" y="308.0" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#111111" text-anchor="start">- /analytics/promotion-readiness</text><text x="656.0" y="330.0" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#111111" text-anchor="start">- /reports  seven reports</text><text x="656.0" y="352.0" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#111111" text-anchor="start">- assistant  (floating, every page)</text><text x="956.0" y="140.0" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#111111" text-anchor="start">- /setup/company  profile + join code</text><text x="956.0" y="162.0" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#111111" text-anchor="start">- /setup/departments</text><text x="956.0" y="184.0" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#111111" text-anchor="start">- /setup/schedule  shifts + holidays</text><text x="956.0" y="206.0" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#111111" text-anchor="start">- /setup/leave-types</text><text x="956.0" y="228.0" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#111111" text-anchor="start">- /setup/award-types</text><text x="956.0" y="250.0" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#111111" text-anchor="start">- /setup/performance  frameworks</text><text x="956.0" y="272.0" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#111111" text-anchor="start">- /setup/onboarding  programmes</text><text x="956.0" y="294.0" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#111111" text-anchor="start">- /setup/offboarding  templates</text><text x="956.0" y="316.0" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#111111" text-anchor="start">- /setup/notifications</text><text x="956.0" y="400.0" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#111111" text-anchor="start">- /system/users</text><text x="956.0" y="422.0" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#111111" text-anchor="start">- /system/roles</text><text x="956.0" y="444.0" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#111111" text-anchor="start">- /system/activity-logs</text><text x="956.0" y="466.0" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#111111" text-anchor="start">- /system/trash</text><rect x="56.0" y="616.0" width="528.0" height="36.0" rx="3" fill="#FFFFFF" stroke="#111111" stroke-width="1.0"/><text x="68.0" y="631.0" font-family="Arial, Helvetica, sans-serif" font-size="9.6" font-weight="bold" fill="#111111" text-anchor="start">Home</text><text x="68.0" y="645.0" font-family="Arial, Helvetica, sans-serif" font-size="8.5" font-weight="normal" fill="#5A5A5A" text-anchor="start">greeting, today's clock state, quick actions, leave-balance mini-cards, latest award, workspace chip</text><rect x="56.0" y="656.0" width="528.0" height="36.0" rx="3" fill="#FFFFFF" stroke="#111111" stroke-width="1.0"/><text x="68.0" y="671.0" font-family="Arial, Helvetica, sans-serif" font-size="9.6" font-weight="bold" fill="#111111" text-anchor="start">Clock  (the hero)</text><text x="68.0" y="685.0" font-family="Arial, Helvetica, sans-serif" font-size="8.5" font-weight="normal" fill="#5A5A5A" text-anchor="start">one primary button whose label flips with the day's state; real GPS + optional selfie; live worked-hours counter</text><rect x="56.0" y="696.0" width="528.0" height="36.0" rx="3" fill="#FFFFFF" stroke="#111111" stroke-width="1.0"/><text x="68.0" y="711.0" font-family="Arial, Helvetica, sans-serif" font-size="9.6" font-weight="bold" fill="#111111" text-anchor="start">Attendance</text><text x="68.0" y="725.0" font-family="Arial, Helvetica, sans-serif" font-size="8.5" font-weight="normal" fill="#5A5A5A" text-anchor="start">month calendar with status dots, metrics card, list view, per-day punch timeline</text><rect x="56.0" y="736.0" width="528.0" height="36.0" rx="3" fill="#FFFFFF" stroke="#111111" stroke-width="1.0"/><text x="68.0" y="751.0" font-family="Arial, Helvetica, sans-serif" font-size="9.6" font-weight="bold" fill="#111111" text-anchor="start">Requests / Leave</text><text x="68.0" y="765.0" font-family="Arial, Helvetica, sans-serif" font-size="8.5" font-weight="normal" fill="#5A5A5A" text-anchor="start">balances per type, file-leave form with server-computed days, history, cancel</text><rect x="56.0" y="776.0" width="528.0" height="36.0" rx="3" fill="#FFFFFF" stroke="#111111" stroke-width="1.0"/><text x="68.0" y="791.0" font-family="Arial, Helvetica, sans-serif" font-size="9.6" font-weight="bold" fill="#111111" text-anchor="start">Profile &amp; Awards</text><text x="68.0" y="805.0" font-family="Arial, Helvetica, sans-serif" font-size="8.5" font-weight="normal" fill="#5A5A5A" text-anchor="start">own 201 profile with government IDs masked and salary omitted entirely, plus recognitions</text><text x="56.0" y="596.0" font-family="Arial, Helvetica, sans-serif" font-size="9.6" font-weight="bold" fill="#5A5A5A" text-anchor="start">MOBILE COMPANION  (Expo / expo-router)</text></svg>