<svg xmlns="http://www.w3.org/2000/svg" width="1238" height="828" viewBox="0 0 1238 828"><rect x="0.0" y="0.0" width="1238.0" height="828.0" rx="0" fill="#FFFFFF" stroke="none" stroke-width="0"/><text x="619.0" y="28.0" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#111111" text-anchor="middle">Figure 3.33  Sequence Diagram - Mobile Clock-In with GPS and Selfie</text><text x="619.0" y="46.0" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#5A5A5A" text-anchor="middle">The mobile client and the web screen traverse the identical canonical path</text><path d="M 60.0 764.0 H 1148.0 L 1160.0 776.0 V 804.0 H 60.0 Z" fill="#F4F4F4" stroke="#111111" stroke-width="1.0"/><path d="M 1148.0 764.0 V 776.0 H 1160.0" fill="none" stroke="#111111" stroke-width="1.0"/><text x="610.0" y="781.4" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">The button's state comes from the SERVER, not the client: the label is computed from today's record, so a lost connection or a reinstalled app can never desynchronise the day.</text><text x="610.0" y="794.4" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">Both this path and the web screen call AttendanceClock, so a punch made on a phone computes identically to one made at a desktop.</text><rect x="20.0" y="78.0" width="180.0" height="46.0" rx="3" fill="#F4F4F4" stroke="#111111" stroke-width="1.0"/><text x="110.0" y="96.0" font-family="Arial, Helvetica, sans-serif" font-size="9.6" font-weight="bold" fill="#111111" text-anchor="middle">Employee</text><text x="110.0" y="109.0" font-family="Arial, Helvetica, sans-serif" font-size="8.8" font-weight="normal" fill="#5A5A5A" text-anchor="middle">(handset)</text><path d="M 110.0 124.0 L 110.0 748.0" fill="none" stroke="#111111" stroke-width="1.0" stroke-dasharray="3 3"/><rect x="200.0" y="78.0" width="180.0" height="46.0" rx="3" fill="#F4F4F4" stroke="#111111" stroke-width="1.0"/><text x="290.0" y="96.0" font-family="Arial, Helvetica, sans-serif" font-size="9.6" font-weight="bold" fill="#111111" text-anchor="middle">Expo client</text><text x="290.0" y="109.0" font-family="Arial, Helvetica, sans-serif" font-size="8.8" font-weight="normal" fill="#5A5A5A" text-anchor="middle">app/(tabs)/clock</text><path d="M 290.0 124.0 L 290.0 748.0" fill="none" stroke="#111111" stroke-width="1.0" stroke-dasharray="3 3"/><rect x="410.0" y="78.0" width="180.0" height="46.0" rx="3" fill="#F4F4F4" stroke="#111111" stroke-width="1.0"/><text x="500.0" y="96.0" font-family="Arial, Helvetica, sans-serif" font-size="9.6" font-weight="bold" fill="#111111" text-anchor="middle">Sanctum +</text><text x="500.0" y="109.0" font-family="Arial, Helvetica, sans-serif" font-size="8.8" font-weight="normal" fill="#5A5A5A" text-anchor="middle">SetCurrentOrganization</text><path d="M 500.0 124.0 L 500.0 748.0" fill="none" stroke="#111111" stroke-width="1.0" stroke-dasharray="3 3"/><rect x="630.0" y="78.0" width="180.0" height="46.0" rx="3" fill="#F4F4F4" stroke="#111111" stroke-width="1.0"/><text x="720.0" y="96.0" font-family="Arial, Helvetica, sans-serif" font-size="9.6" font-weight="bold" fill="#111111" text-anchor="middle">AttendanceClock</text><text x="720.0" y="109.0" font-family="Arial, Helvetica, sans-serif" font-size="8.8" font-weight="normal" fill="#5A5A5A" text-anchor="middle">(canonical writer)</text><path d="M 720.0 124.0 L 720.0 748.0" fill="none" stroke="#111111" stroke-width="1.0" stroke-dasharray="3 3"/><rect x="840.0" y="78.0" width="180.0" height="46.0" rx="3" fill="#F4F4F4" stroke="#111111" stroke-width="1.0"/><text x="930.0" y="96.0" font-family="Arial, Helvetica, sans-serif" font-size="9.6" font-weight="bold" fill="#111111" text-anchor="middle">AttendanceCalculator</text><path d="M 930.0 124.0 L 930.0 748.0" fill="none" stroke="#111111" stroke-width="1.0" stroke-dasharray="3 3"/><rect x="1030.0" y="78.0" width="180.0" height="46.0" rx="3" fill="#F4F4F4" stroke="#111111" stroke-width="1.0"/><text x="1120.0" y="96.0" font-family="Arial, Helvetica, sans-serif" font-size="9.6" font-weight="bold" fill="#111111" text-anchor="middle">PostgreSQL</text><path d="M 1120.0 124.0 L 1120.0 748.0" fill="none" stroke="#111111" stroke-width="1.0" stroke-dasharray="3 3"/><path d="M 110.0 168.0 L 290.0 168.0" fill="none" stroke="#111111" stroke-width="1.0"/><polygon points="290.0,168.0 282.0,172.8 282.0,163.2" fill="#111111" stroke="none" stroke-width="1.4"/><text x="200.0" y="162.0" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#111111" text-anchor="middle">tap the primary button (label reflects TODAY'S SERVER STATE)</text><path d="M 290.0 198.0 L 324.0 198.0 L 324.0 212.0 L 294.0 212.0" fill="none" stroke="#111111" stroke-width="1.0"/><polygon points="294.0,212.0 301.0,207.8 301.0,216.2" fill="#111111" stroke="none" stroke-width="1.4"/><text x="334.0" y="208.0" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="start">capture GPS fix + optional selfie; build multipart body</text><path d="M 290.0 244.0 L 500.0 244.0" fill="none" stroke="#111111" stroke-width="1.0"/><polygon points="500.0,244.0 492.0,248.8 492.0,239.2" fill="#111111" stroke="none" stroke-width="1.4"/><text x="395.0" y="238.0" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#111111" text-anchor="middle">POST /api/attendance/punch   Authorization: Bearer &lt;token&gt;</text><path d="M 500.0 274.0 L 534.0 274.0 L 534.0 288.0 L 504.0 288.0" fill="none" stroke="#111111" stroke-width="1.0"/><polygon points="504.0,288.0 511.0,283.8 511.0,292.2" fill="#111111" stroke="none" stroke-width="1.4"/><text x="544.0" y="284.0" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="start">resolve user; bind the token's organisation; validate membership</text><path d="M 500.0 320.0 L 720.0 320.0" fill="none" stroke="#111111" stroke-width="1.0"/><polygon points="720.0,320.0 712.0,324.8 712.0,315.2" fill="#111111" stroke="none" stroke-width="1.4"/><text x="610.0" y="314.0" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#111111" text-anchor="middle">can:attendance.clock  -&gt;  punch(type, source='mobile', gps, photo)</text><path d="M 720.0 350.0 L 754.0 350.0 L 754.0 364.0 L 724.0 364.0" fill="none" stroke="#111111" stroke-width="1.0"/><polygon points="724.0,364.0 731.0,359.8 731.0,368.2" fill="#111111" stroke="none" stroke-width="1.4"/><text x="764.0" y="360.0" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="start">find or create today's attendance_record</text><path d="M 720.0 388.0 L 754.0 388.0 L 754.0 402.0 L 724.0 402.0" fill="none" stroke="#111111" stroke-width="1.0"/><polygon points="724.0,402.0 731.0,397.8 731.0,406.2" fill="#111111" stroke="none" stroke-width="1.4"/><text x="764.0" y="398.0" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="start">validate the transition (no double clock-in, no out before in,</text><path d="M 720.0 406.0 L 754.0 406.0 L 754.0 420.0 L 724.0 420.0" fill="none" stroke="#111111" stroke-width="1.0"/><polygon points="724.0,420.0 731.0,415.8 731.0,424.2" fill="#111111" stroke="none" stroke-width="1.4"/><text x="764.0" y="416.0" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="start">breaks only while on the clock)</text><path d="M 720.0 452.0 L 1120.0 452.0" fill="none" stroke="#111111" stroke-width="1.0"/><polygon points="1120.0,452.0 1112.0,456.8 1112.0,447.2" fill="#111111" stroke="none" stroke-width="1.4"/><text x="920.0" y="446.0" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#111111" text-anchor="middle">INSERT attendance_punches (+ store selfie on the private disk)</text><path d="M 720.0 490.0 L 930.0 490.0" fill="none" stroke="#111111" stroke-width="1.0"/><polygon points="930.0,490.0 922.0,494.8 922.0,485.2" fill="#111111" stroke="none" stroke-width="1.4"/><text x="825.0" y="484.0" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#111111" text-anchor="middle">recompute(record, schedule, onApprovedLeave)</text><path d="M 930.0 520.0 L 964.0 520.0 L 964.0 534.0 L 934.0 534.0" fill="none" stroke="#111111" stroke-width="1.0"/><polygon points="934.0,534.0 941.0,529.8 941.0,538.2" fill="#111111" stroke="none" stroke-width="1.4"/><text x="974.0" y="530.0" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="start">walk the punch stream; derive worked / break / late /</text><path d="M 930.0 538.0 L 964.0 538.0 L 964.0 552.0 L 934.0 552.0" fill="none" stroke="#111111" stroke-width="1.0"/><polygon points="934.0,552.0 941.0,547.8 941.0,556.2" fill="#111111" stroke="none" stroke-width="1.4"/><text x="974.0" y="548.0" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="start">undertime / overtime minutes and the daily status</text><path d="M 930.0 584.0 L 720.0 584.0" fill="none" stroke="#111111" stroke-width="1.0"/><polygon points="720.0,584.0 728.0,579.2 728.0,588.8" fill="#111111" stroke="none" stroke-width="1.4"/><text x="825.0" y="578.0" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#111111" text-anchor="middle">mutated record attributes</text><path d="M 720.0 622.0 L 1120.0 622.0" fill="none" stroke="#111111" stroke-width="1.0"/><polygon points="1120.0,622.0 1112.0,626.8 1112.0,617.2" fill="#111111" stroke="none" stroke-width="1.4"/><text x="920.0" y="616.0" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#111111" text-anchor="middle">UPDATE attendance_records</text><path d="M 720.0 660.0 L 500.0 660.0" fill="none" stroke="#111111" stroke-width="1.0"/><polygon points="500.0,660.0 508.0,655.2 508.0,664.8" fill="#111111" stroke="none" stroke-width="1.4"/><text x="610.0" y="654.0" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#111111" text-anchor="middle">today's state + running worked-hours counter</text><path d="M 500.0 698.0 L 290.0 698.0" fill="none" stroke="#111111" stroke-width="1.0"/><polygon points="290.0,698.0 298.0,693.2 298.0,702.8" fill="#111111" stroke="none" stroke-width="1.4"/><text x="395.0" y="692.0" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#111111" text-anchor="middle">200 OK  { status, next_action, worked_minutes }</text><path d="M 290.0 736.0 L 110.0 736.0" fill="none" stroke="#111111" stroke-width="1.0"/><polygon points="110.0,736.0 118.0,731.2 118.0,740.8" fill="#111111" stroke="none" stroke-width="1.4"/><text x="200.0" y="730.0" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#111111" text-anchor="middle">button flips to the next legal action</text></svg>