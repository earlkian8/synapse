90.0" y="158.0" font-family="Arial, Helvetica, sans-serif" font-size="9.8" font-weight="normal" fill="#111111" text-anchor="middle">Submit application (public)</text><rect x="310.0" y="181.0" width="300.0" height="38.0" rx="19.0" fill="#FFFFFF" stroke="#111111" stroke-width="1.0"/><text x="460.0" y="204.0" font-family="Arial, Helvetica, sans-serif" font-size="9.8" font-weight="normal" fill="#111111" text-anchor="middle">Review ranked candidates</text><rect x="640.0" y="181.0" width="300.0" height="38.0" rx="19.0" fill="#FFFFFF" stroke="#111111" stroke-width="1.0"/><text x="790.0" y="204.0" font-family="Arial, Helvetica, sans-serif" font-size="9.8" font-weight="normal" fill="#111111" text-anchor="middle">Schedule and score interview</text><rect x="310.0" y="227.0" width="300.0" height="38.0" rx="19.0" fill="#FFFFFF" stroke="#111111" stroke-width="1.0"/><text x="460.0" y="250.0" font-family="Arial, Helvetica, sans-serif" font-size="9.8" font-weight="normal" fill="#111111" text-anchor="middle">Hire applicant (bridge)</text><rect x="310.0" y="279.0" width="300.0" height="38.0" rx="19.0" fill="#FFFFFF" stroke="#111111" stroke-width="1.0"/><text x="460.0" y="302.0" font-family="Arial, Helvetica, sans-serif" font-size="9.8" font-weight="normal" fill="#111111" text-anchor="middle">Maintain 201 file</text><rect x="640.0" y="279.0" width="300.0" height="38.0" rx="19.0" fill="#FFFFFF" stroke="#111111" stroke-width="1.0"/><text x="790.0" y="302.0" font-family="Arial, Helvetica, sans-serif" font-size="9.8" font-weight="normal" fill="#111111" text-anchor="middle">Invite employee to the app</text><rect x="310.0" y="325.0" width="300.0" height="38.0" rx="19.0" fill="#FFFFFF" stroke="#111111" stroke-width="1.0"/><text x="460.0" y="348.0" font-family="Arial, Helvetica, sans-serif" font-size="9.8" font-weight="normal" fill="#111111" text-anchor="middle">Run onboarding checklist</text><rect x="640.0" y="325.0" width="300.0" height="38.0" rx="19.0" fill="#FFFFFF" stroke="#111111" stroke-width="1.0"/><text x="790.0" y="348.0" font-family="Arial, Helvetica, sans-serif" font-size="9.8" font-weight="normal" fill="#111111" text-anchor="middle">Complete offboarding clearance</text><rect x="310.0" y="423.0" width="300.0" height="38.0" rx="19.0" fill="#FFFFFF" stroke="#111111" stroke-width="1.0"/><text x="460.0" y="446.0" font-family="Arial, Helvetica, sans-serif" font-size="9.8" font-weight="normal" fill="#111111" text-anchor="middle">Clock in / out (GPS + selfie)</text><rect x="640.0" y="423.0" width="300.0" height="38.0" rx="19.0" fill="#FFFFFF" stroke="#111111" stroke-width="1.0"/><text x="790.0" y="446.0" font-family="Arial, Helvetica, sans-serif" font-size="9.8" font-weight="normal" fill="#111111" text-anchor="middle">Correct and approve DTR</text><rect x="310.0" y="469.0" width="300.0" height="38.0" rx="19.0" fill="#FFFFFF" stroke="#111111" stroke-width="1.0"/><text x="460.0" y="492.0" font-family="Arial, Helvetica, sans-serif" font-size="9.8" font-weight="normal" fill="#111111" text-anchor="middle">File leave request</text><rect x="640.0" y="469.0" width="300.0" height="38.0" rx="19.0" fill="#FFFFFF" stroke="#111111" stroke-width="1.0"/><text x="790.0" y="492.0" font-family="Arial, Helvetica, sans-serif" font-size="9.8" font-weight="normal" fill="#111111" text-anchor="middle">Approve / reject leave</text><rect x="310.0" y="567.0" width="300.0" height="38.0" rx="19.0" fill="#FFFFFF" stroke="#111111" stroke-width="1.0"/><text x="460.0" y="590.0" font-family="Arial, Helvetica, sans-serif" font-size="9.8" font-weight="normal" fill="#111111" text-anchor="middle">Conduct appraisal</text><rect x="640.0" y="567.0" width="300.0" height="38.0" rx="19.0" fill="#FFFFFF" stroke="#111111" stroke-width="1.0"/><text x="790.0" y="590.0" font-family="Arial, Helvetica, sans-serif" font-size="9.8" font-weight="normal" fill="#111111" text-anchor="middle">Calibrate a review cycle</text><rect x="310.0" y="613.0" width="300.0" height="38.0" rx="19.0" fill="#FFFFFF" strok