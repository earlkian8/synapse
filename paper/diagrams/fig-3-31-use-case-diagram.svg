<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="948" viewBox="0 0 1240 948"><rect x="0.0" y="0.0" width="1240.0" height="948.0" rx="0" fill="#FFFFFF" stroke="none" stroke-width="0"/><text x="620.0" y="28.0" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#111111" text-anchor="middle">Figure 3.31  Use Case Diagram of SYNAPSE</text><text x="620.0" y="46.0" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#5A5A5A" text-anchor="middle">Three built-in roles, the public applicant, and two system actors; the boundary is the tenant</text><rect x="300.0" y="80.0" width="640.0" height="800.0" rx="8" fill="#FFFFFF" stroke="#111111" stroke-width="1.4"/><text x="620.0" y="104.0" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#5A5A5A" text-anchor="middle">SYNAPSE  (within one organisation)</text><text x="322.0" y="128.0" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="bold" fill="#5A5A5A" text-anchor="start">TALENT ACQUISITION</text><text x="322.0" y="272.0" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="bold" fill="#5A5A5A" text-anchor="start">WORKFORCE OPERATIONS</text><text x="322.0" y="416.0" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="bold" fill="#5A5A5A" text-anchor="start">TIME AND ATTENDANCE</text><text x="322.0" y="560.0" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="bold" fill="#5A5A5A" text-anchor="start">DEVELOPMENT AND RECOGNITION</text><text x="322.0" y="704.0" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="bold" fill="#5A5A5A" text-anchor="start">INTELLIGENCE</text><path d="M 300.0 894.0 H 928.0 L 940.0 906.0 V 928.0 H 300.0 Z" fill="#F4F4F4" stroke="#111111" stroke-width="1.0"/><path d="M 928.0 894.0 V 906.0 H 940.0" fill="none" stroke="#111111" stroke-width="1.0"/><text x="620.0" y="914.9" font-family="Arial, Helvetica, sans-serif" font-size="8.8" font-weight="normal" fill="#5A5A5A" text-anchor="middle">Every use case is additionally gated by one of the 73 named permissions; the three roles are default bundles, and a tenant may compose its own.</text><circle cx="130.0" cy="150.0" r="11.0" fill="#FFFFFF" stroke="#111111" stroke-width="1.4"/><path d="M 130.0 161.0 L 130.0 190.0" fill="none" stroke="#111111" stroke-width="1.4"/><path d="M 114.0 172.0 L 146.0 172.0" fill="none" stroke="#111111" stroke-width="1.4"/><path d="M 130.0 190.0 L 116.0 212.0" fill="none" stroke="#111111" stroke-width="1.4"/><path d="M 130.0 190.0 L 144.0 212.0" fill="none" stroke="#111111" stroke-width="1.4"/><text x="130.0" y="230.0" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="bold" fill="#111111" text-anchor="middle">HR Manager</text><text x="130.0" y="243.0" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">owner - all permissions</text><circle cx="130.0" cy="400.0" r="11.0" fill="#FFFFFF" stroke="#111111" stroke-width="1.4"/><path d="M 130.0 411.0 L 130.0 440.0" fill="none" stroke="#111111" stroke-width="1.4"/><path d="M 114.0 422.0 L 146.0 422.0" fill="none" stroke="#111111" stroke-width="1.4"/><path d="M 130.0 440.0 L 116.0 462.0" fill="none" stroke="#111111" stroke-width="1.4"/><path d="M 130.0 440.0 L 144.0 462.0" fill="none" stroke="#111111" stroke-width="1.4"/><text x="130.0" y="480.0" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="bold" fill="#111111" text-anchor="middle">Department Head</text><text x="130.0" y="493.0" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">supervisor</text><circle cx="130.0" cy="640.0" r="11.0" fill="#FFFFFF" stroke="#111111" stroke-width="1.4"/><path d="M 130.0 651.0 L 130.0 680.0" fill="none" stroke="#111111" stroke-width="1.4"/><path d="M 114.0 662.0 L 146.0 662.0" fill="none" stroke="#1