<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1252" viewBox="0 0 1100 1252"><rect x="0.0" y="0.0" width="1100.0" height="1252.0" rx="0" fill="#FFFFFF" stroke="none" stroke-width="0"/><text x="550.0" y="28.0" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#111111" text-anchor="middle">Figure 3.23  Flowchart - Predictive Assessment Run</text><text x="550.0" y="46.0" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#5A5A5A" text-anchor="middle">The health check precedes the prediction call, so the system decides whether it can predict before it tries</text><rect x="280.0" y="84.0" width="340.0" height="36.0" rx="18.0" fill="#F4F4F4" stroke="#111111" stroke-width="1.4"/><text x="450.0" y="105.8" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#111111" text-anchor="middle">START  -  HR presses Run assessment</text><rect x="220.0" y="146.0" width="460.0" height="59.0" rx="12" fill="#FFFFFF" stroke="#111111" stroke-width="1.4"/><text x="450.0" y="166.3" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#111111" text-anchor="middle">Select the cohort: every ACTIVE employee</text><text x="450.0" y="179.3" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">eager-loads department, scored appraisals, promotions,</text><text x="450.0" y="192.3" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">90-day overtime sum and 12-month training count</text><rect x="220.0" y="231.0" width="460.0" height="46.0" rx="12" fill="#FFFFFF" stroke="#111111" stroke-width="1.4"/><text x="450.0" y="251.3" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#111111" text-anchor="middle">Map each employee to a feature dictionary</text><text x="450.0" y="264.4" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">ungroundable inputs are OMITTED, never sent as zero</text><rect x="220.0" y="303.0" width="460.0" height="36.0" rx="12" fill="#FFFFFF" stroke="#111111" stroke-width="1.4"/><text x="450.0" y="324.9" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#111111" text-anchor="middle">Keep the exact feature snapshot per employee</text><polygon points="450.0,365.0 610.0,406.0 450.0,447.0 290.0,406.0" fill="#FFFFFF" stroke="#111111" stroke-width="1.4"/><text x="450.0" y="403.4" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#111111" text-anchor="middle">ML service reachable?</text><text x="450.0" y="416.4" font-family="Arial, Helvetica, sans-serif" font-size="8.7" font-weight="normal" fill="#5A5A5A" text-anchor="middle">GET /health with a short timeout</text><rect x="790.0" y="407.0" width="270.0" height="96.0" rx="3" fill="#FFFFFF" stroke="#111111" stroke-width="1.4" stroke-dasharray="6 4"/><text x="925.0" y="432.9" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#111111" text-anchor="middle">DEGRADED PATH</text><text x="925.0" y="445.9" font-family="Arial, Helvetica, sans-serif" font-size="8.7" font-weight="normal" fill="#5A5A5A" text-anchor="middle">show the LAST STORED run with an</text><text x="925.0" y="458.9" font-family="Arial, Helvetica, sans-serif" font-size="8.7" font-weight="normal" fill="#5A5A5A" text-anchor="middle">offline banner; record no new run;</text><text x="925.0" y="471.9" font-family="Arial, Helvetica, sans-serif" font-size="8.7" font-weight="normal" fill="#5A5A5A" text-anchor="middle">surface the exact command that starts</text><text x="925.0" y="484.9" font-family="Arial, Helvetica, sans-serif" font-size="8.7" font-weight="normal" fill="#5A5A5A" text-anchor="middle">the service</text><rect x="220.0" y="489.0" width="460.0" height="58.0" rx="12" fill="#FFFFFF" stroke="#111111" stroke-width="1.4"/><text x="450.0" y="515.4" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#111111" text-anchor="middle">POST /predict/{model} with the whole batch</text><text x="450.0" y="528.4" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">{ instances: [ { ref, features }, ... ] }</text><rect x="220.0" y="577.0" width="460.0" height="70.0" rx="12" fill="#F4F4F4" stroke="#111111" stroke-width="1.4"/><text x="450.0" y="602.9" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#111111" text-anchor="middle">Service aligns to a full-width DataFrame</text><text x="450.0" y="615.9" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">the fitted imputers fill the gaps; handle_unknown='ignore'</text><text x="450.0" y="628.9" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">neutralises a category the model never saw</text><rect x="220.0" y="677.0" width="460.0" height="58.0" rx="12" fill="#FFFFFF" stroke="#111111" stroke-width="1.4"/><text x="450.0" y="703.4" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#111111" text-anchor="middle">Score; decompose contributions for the linear model only</text><text x="450.0" y="716.4" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">a forest and a point regressor expose no per-instance 'why'</text><rect x="220.0" y="765.0" width="460.0" height="72.0" rx="12" fill="#F4F4F4" stroke="#111111" stroke-width="1.4"/><text x="450.0" y="791.9" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#111111" text-anchor="middle">Laravel derives the human-facing quantities</text><text x="450.0" y="804.9" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">tier from probability  |  band from predicted rating</text><text x="450.0" y="817.9" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">confidence = grounded key features / total key features</text><rect x="220.0" y="867.0" width="460.0" height="70.0" rx="12" fill="#FFFFFF" stroke="#111111" stroke-width="1.4"/><text x="450.0" y="892.9" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#111111" text-anchor="middle">Persist inside one transaction</text><text x="450.0" y="905.9" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">ONE run header + ONE score row per employee,</text><text x="450.0" y="918.9" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">each carrying its feature snapshot; log the activity</text><rect x="220.0" y="967.0" width="460.0" height="58.0" rx="12" fill="#FFFFFF" stroke="#111111" stroke-width="1.4"/><text x="450.0" y="993.4" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#111111" text-anchor="middle">Render the ranked list; past runs stay selectable</text><text x="450.0" y="1006.4" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">predictions are NEVER written onto the employee record</text><polygon points="450.0,1055.0 580.0,1092.0 450.0,1129.0 320.0,1092.0" fill="#FFFFFF" stroke="#111111" stroke-width="1.4"/><text x="450.0" y="1095.8" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#111111" text-anchor="middle">Export report?</text><rect x="790.0" y="1063.0" width="250.0" height="56.0" rx="12" fill="#FFFFFF" stroke="#111111" stroke-width="1.4"/><text x="915.0" y="1094.8" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#111111" text-anchor="middle">Generate report / CSV</text><rect x="370.0" y="1155.0" width="160.0" height="36.0" rx="18.0" fill="#F4F4F4" stroke="#111111" stroke-width="1.4"/><text x="450.0" y="1176.8" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#111111" text-anchor="middle">END</text><path d="M 60.0 747.0 H 298.0 L 310.0 759.0 V 875.0 H 60.0 Z" fill="#F4F4F4" stroke="#111111" stroke-width="1.0"/><path d="M 298.0 747.0 V 759.0 H 310.0" fill="none" stroke="#111111" stroke-width="1.0"/><text x="185.0" y="769.4" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="bold" fill="#111111" text-anchor="middle">WHY STORE THE SNAPSHOT</text><text x="185.0" y="782.4" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">A stored score alone says what the</text><text x="185.0" y="795.4" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">model answered. The snapshot says</text><text x="185.0" y="808.4" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">what it was ASKED. That is what</text><text x="185.0" y="821.4" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">makes an old prediction auditable,</text><text x="185.0" y="834.4" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">and what lets a low-confidence</text><text x="185.0" y="847.4" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">score be explained rather than</text><text x="185.0" y="860.4" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">defended.</text><path d="M 450.0 120.0 L 450.0 146.0" fill="none" stroke="#111111" stroke-width="1.4"/><polygon points="450.0,146.0 444.6,137.0 455.4,137.0" fill="#111111" stroke="none" stroke-width="1.4"/><path d="M 450.0 205.0 L 450.0 231.0" fill="none" stroke="#111111" stroke-width="1.4"/><polygon points="450.0,231.0 444.6,222.0 455.4,222.0" fill="#111111" stroke="none" stroke-width="1.4"/><path d="M 450.0 277.0 L 450.0 303.0" fill="none" stroke="#111111" stroke-width="1.4"/><polygon points="450.0,303.0 444.6,294.0 455.4,294.0" fill="#111111" stroke="none" stroke-width="1.4"/><path d="M 450.0 339.0 L 450.0 365.0" fill="none" stroke="#111111" stroke-width="1.4"/><polygon points="450.0,365.0 444.6,356.0 455.4,356.0" fill="#111111" stroke="none" stroke-width="1.4"/><path d="M 610.0 406.0 L 700.0 406.0 L 700.0 455.0 L 790.0 455.0" fill="none" stroke="#111111" stroke-width="1.4" stroke-dasharray="6 4"/><polygon points="790.0,455.0 781.0,460.4 781.0,449.6" fill="#111111" stroke="none" stroke-width="1.4"/><path d="M 450.0 447.0 L 450.0 489.0" fill="none" stroke="#111111" stroke-width="1.4"/><polygon points="450.0,489.0 444.6,480.0 455.4,480.0" fill="#111111" stroke="none" stroke-width="1.4"/><path d="M 450.0 547.0 L 450.0 577.0" fill="none" stroke="#111111" stroke-width="1.4"/><polygon points="450.0,577.0 444.6,568.0 455.4,568.0" fill="#111111" stroke="none" stroke-width="1.4"/><path d="M 450.0 647.0 L 450.0 677.0" fill="none" stroke="#111111" stroke-width="1.4"/><polygon points="450.0,677.0 444.6,668.0 455.4,668.0" fill="#111111" stroke="none" stroke-width="1.4"/><path d="M 450.0 735.0 L 450.0 765.0" fill="none" stroke="#111111" stroke-width="1.4"/><polygon points="450.0,765.0 444.6,756.0 455.4,756.0" fill="#111111" stroke="none" stroke-width="1.4"/><path d="M 450.0 837.0 L 450.0 867.0" fill="none" stroke="#111111" stroke-width="1.4"/><polygon points="450.0,867.0 444.6,858.0 455.4,858.0" fill="#111111" stroke="none" stroke-width="1.4"/><path d="M 450.0 937.0 L 450.0 967.0" fill="none" stroke="#111111" stroke-width="1.4"/><polygon points="450.0,967.0 444.6,958.0 455.4,958.0" fill="#111111" stroke="none" stroke-width="1.4"/><path d="M 925.0 503.0 L 925.0 996.0 L 680.0 996.0" fill="none" stroke="#111111" stroke-width="1.4" stroke-dasharray="6 4"/><polygon points="680.0,996.0 689.0,990.6 689.0,1001.4" fill="#111111" stroke="none" stroke-width="1.4"/><path d="M 450.0 1025.0 L 450.0 1055.0" fill="none" stroke="#111111" stroke-width="1.4"/><polygon points="450.0,1055.0 444.6,1046.0 455.4,1046.0" fill="#111111" stroke="none" stroke-width="1.4"/><path d="M 580.0 1092.0 L 685.0 1092.0 L 685.0 1091.0 L 790.0 1091.0" fill="none" stroke="#111111" stroke-width="1.4"/><polygon points="790.0,1091.0 781.0,1096.4 781.0,1085.6" fill="#111111" stroke="none" stroke-width="1.4"/><path d="M 450.0 1129.0 L 450.0 1155.0" fill="none" stroke="#111111" stroke-width="1.4"/><polygon points="450.0,1155.0 444.6,1146.0 455.4,1146.0" fill="#111111" stroke="none" stroke-width="1.4"/><path d="M 915.0 1119.0 L 915.0 1173.0 L 530.0 1173.0" fill="none" stroke="#111111" stroke-width="1.4"/><polygon points="530.0,1173.0 539.0,1167.6 539.0,1178.4" fill="#111111" stroke="none" stroke-width="1.4"/><rect x="692.0" y="414.6" width="16.1" height="13.7" rx="2" fill="#FFFFFF" stroke="none" stroke-width="0"/><text x="700.0" y="424.5" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="normal" fill="#111111" text-anchor="middle">No</text><rect x="439.4" y="452.1" width="21.1" height="13.7" rx="2" fill="#FFFFFF" stroke="none" stroke-width="0"/><text x="450.0" y="462.0" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="normal" fill="#111111" text-anchor="middle">Yes</text><rect x="674.4" y="1075.6" width="21.1" height="13.7" rx="2" fill="#FFFFFF" stroke="none" stroke-width="0"/><text x="685.0" y="1085.5" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="normal" fill="#111111" text-anchor="middle">Yes</text><rect x="442.0" y="1126.1" width="16.1" height="13.7" rx="2" fill="#FFFFFF" stroke="none" stroke-width="0"/><text x="450.0" y="1136.0" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="normal" fill="#111111" text-anchor="middle">No</text><text x="790.0" y="1135.0" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="bold" fill="#111111" text-anchor="start">LEGEND</text><rect x="790.0" y="1141.0" width="22.0" height="12.0" rx="6" fill="#FFFFFF" stroke="#111111" stroke-width="1.0"/><text x="820.0" y="1150.5" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="normal" fill="#5A5A5A" text-anchor="start">process / action</text><polygon points="801.0,1157.0 812.0,1164.0 801.0,1171.0 790.0,1164.0" fill="#FFFFFF" stroke="#111111" stroke-width="1.0"/><text x="820.0" y="1167.5" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="normal" fill="#5A5A5A" text-anchor="start">decision</text><rect x="790.0" y="1175.0" width="22.0" height="12.0" rx="2" fill="#FFFFFF" stroke="#111111" stroke-width="1.0"/><text x="820.0" y="1184.5" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="normal" fill="#5A5A5A" text-anchor="start">terminator / data</text><path d="M 790.0 1198.0 L 812.0 1198.0" fill="none" stroke="#111111" stroke-width="1.4"/><polygon points="812.0,1198.0 803.0,1203.4 803.0,1192.6" fill="#111111" stroke="none" stroke-width="1.4"/><text x="820.0" y="1201.5" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="normal" fill="#5A5A5A" text-anchor="start">control flow</text><path d="M 790.0 1215.0 L 812.0 1215.0" fill="none" stroke="#111111" stroke-width="1.4" stroke-dasharray="6 4"/><polygon points="812.0,1215.0 803.0,1220.4 803.0,1209.6" fill="#111111" stroke="none" stroke-width="1.4"/><text x="820.0" y="1218.5" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="normal" fill="#5A5A5A" text-anchor="start">loop / degraded path</text></svg>