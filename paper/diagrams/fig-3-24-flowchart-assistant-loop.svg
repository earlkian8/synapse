<svg xmlns="http://www.w3.org/2000/svg" width="1294" height="1284" viewBox="0 0 1294 1284"><rect x="0.0" y="0.0" width="1294.0" height="1284.0" rx="0" fill="#FFFFFF" stroke="none" stroke-width="0"/><text x="647.0" y="28.0" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#111111" text-anchor="middle">Figure 3.24  Flowchart - LLM Assistant Function-Calling Loop</text><text x="647.0" y="46.0" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#5A5A5A" text-anchor="middle">Permission filtering precedes the model call; the loop has a hard ceiling of six round-trips</text><rect x="260.0" y="84.0" width="400.0" height="36.0" rx="18.0" fill="#F4F4F4" stroke="#111111" stroke-width="1.4"/><text x="460.0" y="105.8" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#111111" text-anchor="middle">START  -  user sends a message (optionally with files)</text><rect x="250.0" y="146.0" width="420.0" height="36.0" rx="12" fill="#FFFFFF" stroke="#111111" stroke-width="1.4"/><text x="460.0" y="167.8" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#111111" text-anchor="middle">Throttle: 12 requests / minute, 240 / day per user</text><rect x="250.0" y="208.0" width="420.0" height="36.0" rx="12" fill="#FFFFFF" stroke="#111111" stroke-width="1.4"/><text x="460.0" y="229.8" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#111111" text-anchor="middle">Filter capability modules to those available to this user</text><rect x="230.0" y="270.0" width="460.0" height="46.0" rx="12" fill="#FFFFFF" stroke="#111111" stroke-width="1.4"/><text x="460.0" y="290.4" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#111111" text-anchor="middle">Build PERMISSION-SCOPED tool schemas</text><text x="460.0" y="303.4" font-family="Arial, Helvetica, sans-serif" font-size="8.7" font-weight="normal" fill="#5A5A5A" text-anchor="middle">a view-only recruiter is offered 8 tools where a full recruiter is offered 25</text><rect x="230.0" y="342.0" width="460.0" height="36.0" rx="12" fill="#FFFFFF" stroke="#111111" stroke-width="1.4"/><text x="460.0" y="363.9" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#111111" text-anchor="middle">Call Gemini with history + files + system instruction</text><polygon points="460.0,404.0 610.0,441.0 460.0,478.0 310.0,441.0" fill="#FFFFFF" stroke="#111111" stroke-width="1.4"/><text x="460.0" y="444.9" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#111111" text-anchor="middle">Function call requested?</text><rect x="800.0" y="416.0" width="250.0" height="56.0" rx="12" fill="#FFFFFF" stroke="#111111" stroke-width="1.4"/><text x="925.0" y="441.4" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#111111" text-anchor="middle">Return the prose answer</text><text x="925.0" y="454.4" font-family="Arial, Helvetica, sans-serif" font-size="8.7" font-weight="normal" fill="#5A5A5A" text-anchor="middle">the common look-something-up turn</text><polygon points="460.0,518.0 650.0,560.0 460.0,602.0 270.0,560.0" fill="#FFFFFF" stroke="#111111" stroke-width="1.4"/><text x="460.0" y="563.9" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#111111" text-anchor="middle">Permitted, known tool and valid arguments?</text><rect x="800.0" y="528.0" width="250.0" height="66.0" rx="3" fill="#FFFFFF" stroke="#111111" stroke-width="1.4" stroke-dasharray="6 4"/><text x="925.0" y="551.9" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#111111" text-anchor="middle">Return a refusal or a request to clarify</text><text x="925.0" y="564.9" font-family="Arial, Helvetica, sans-serif" font-size="8.7" font-weight="normal" fill="#5A5A5A" text-anchor="middle">only errors and unknown tools are fed</text><text x="925.0" y="577.9" font-family="Arial, Helvetica, sans-serif" font-size="8.7" font-weight="normal" fill="#5A5A5A" text-anchor="middle">back to the model to recover</text><rect x="230.0" y="624.0" width="460.0" height="72.0" rx="12" fill="#F4F4F4" stroke="#111111" stroke-width="1.4"/><text x="460.0" y="650.9" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#111111" text-anchor="middle">Execute through the canonical module class</text><text x="460.0" y="663.9" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">permission re-checked, tenancy applied, input validated,</text><text x="460.0" y="676.9" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">activity logged, notifications sent - in one box on purpose</text><rect x="230.0" y="724.0" width="460.0" height="72.0" rx="12" fill="#FFFFFF" stroke="#111111" stroke-width="1.4"/><text x="460.0" y="750.9" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#111111" text-anchor="middle">Apply outcome guards</text><text x="460.0" y="763.9" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">advance_application stops at reject or hire;</text><text x="460.0" y="776.9" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">negative and irreversible outcomes stay human decisions</text><rect x="230.0" y="824.0" width="460.0" height="72.0" rx="12" fill="#FFFFFF" stroke="#111111" stroke-width="1.4"/><text x="460.0" y="850.9" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#111111" text-anchor="middle">Sanitise the tool result</text><text x="460.0" y="863.9" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">strip control characters, cap free text, cap lists at 25 rows,</text><text x="460.0" y="876.9" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">withhold the nine disclosure-restricted fields</text><polygon points="460.0,924.0 650.0,966.0 460.0,1008.0 270.0,966.0" fill="#FFFFFF" stroke="#111111" stroke-width="1.4"/><text x="460.0" y="969.9" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#111111" text-anchor="middle">Did EVERY call in this step succeed?</text><rect x="230.0" y="1034.0" width="460.0" height="66.0" rx="12" fill="#F4F4F4" stroke="#111111" stroke-width="1.4"/><text x="460.0" y="1064.3" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#111111" text-anchor="middle">Compose the reply LOCALLY from the results</text><text x="460.0" y="1077.3" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">saves a second Gemini request on the common turn</text><polygon points="910.0,928.0 1050.0,967.0 910.0,1006.0 770.0,967.0" fill="#FFFFFF" stroke="#111111" stroke-width="1.4"/><text x="910.0" y="970.9" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#111111" text-anchor="middle">Round-trip &lt; 6?</text><rect x="800.0" y="1038.0" width="250.0" height="60.0" rx="3" fill="#FFFFFF" stroke="#111111" stroke-width="1.4" stroke-dasharray="6 4"/><text x="925.0" y="1065.3" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#111111" text-anchor="middle">Stop and report what was done</text><text x="925.0" y="1078.3" font-family="Arial, Helvetica, sans-serif" font-size="8.7" font-weight="normal" fill="#5A5A5A" text-anchor="middle">bounded latency and bounded API cost</text><rect x="230.0" y="1132.0" width="460.0" height="56.0" rx="12" fill="#FFFFFF" stroke="#111111" stroke-width="1.4"/><text x="460.0" y="1157.3" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#111111" text-anchor="middle">Persist the conversation; log named-person reads</text><text x="460.0" y="1170.3" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">searches and headcounts are not logged as views</text><rect x="380.0" y="1220.0" width="160.0" height="36.0" rx="18.0" fill="#F4F4F4" stroke="#111111" stroke-width="1.4"/><text x="460.0" y="1241.8" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#111111" text-anchor="middle">END</text><path d="M 20.0 728.0 H 208.0 L 220.0 740.0 V 886.0 H 20.0 Z" fill="#F4F4F4" stroke="#111111" stroke-width="1.0"/><path d="M 208.0 728.0 V 740.0 H 220.0" fill="none" stroke="#111111" stroke-width="1.0"/><text x="120.0" y="758.9" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="bold" fill="#111111" text-anchor="middle">THE GOVERNING RULE</text><text x="120.0" y="771.9" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">The model only DECIDES which</text><text x="120.0" y="784.9" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">action to take and with what</text><text x="120.0" y="797.9" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">arguments. The module ENFORCES.</text><text x="120.0" y="810.9" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">Tool results and uploaded documents</text><text x="120.0" y="823.9" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">are treated as data, never as</text><text x="120.0" y="836.9" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">instructions - retrieved text can</text><text x="120.0" y="849.9" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">never grant a permission or trigger</text><text x="120.0" y="862.9" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">an action.</text><path d="M 460.0 120.0 L 460.0 146.0" fill="none" stroke="#111111" stroke-width="1.4"/><polygon points="460.0,146.0 454.6,137.0 465.4,137.0" fill="#111111" stroke="none" stroke-width="1.4"/><path d="M 460.0 182.0 L 460.0 208.0" fill="none" stroke="#111111" stroke-width="1.4"/><polygon points="460.0,208.0 454.6,199.0 465.4,199.0" fill="#111111" stroke="none" stroke-width="1.4"/><path d="M 460.0 244.0 L 460.0 270.0" fill="none" stroke="#111111" stroke-width="1.4"/><polygon points="460.0,270.0 454.6,261.0 465.4,261.0" fill="#111111" stroke="none" stroke-width="1.4"/><path d="M 460.0 316.0 L 460.0 342.0" fill="none" stroke="#111111" stroke-width="1.4"/><polygon points="460.0,342.0 454.6,333.0 465.4,333.0" fill="#111111" stroke="none" stroke-width="1.4"/><path d="M 460.0 378.0 L 460.0 404.0" fill="none" stroke="#111111" stroke-width="1.4"/><polygon points="460.0,404.0 454.6,395.0 465.4,395.0" fill="#111111" stroke="none" stroke-width="1.4"/><path d="M 610.0 441.0 L 705.0 441.0 L 705.0 444.0 L 800.0 444.0" fill="none" stroke="#111111" stroke-width="1.4"/><polygon points="800.0,444.0 791.0,449.4 791.0,438.6" fill="#111111" stroke="none" stroke-width="1.4"/><path d="M 460.0 478.0 L 460.0 518.0" fill="none" stroke="#111111" stroke-width="1.4"/><polygon points="460.0,518.0 454.6,509.0 465.4,509.0" fill="#111111" stroke="none" stroke-width="1.4"/><path d="M 650.0 560.0 L 725.0 560.0 L 725.0 561.0 L 800.0 561.0" fill="none" stroke="#111111" stroke-width="1.4" stroke-dasharray="6 4"/><polygon points="800.0,561.0 791.0,566.4 791.0,555.6" fill="#111111" stroke="none" stroke-width="1.4"/><path d="M 460.0 602.0 L 460.0 624.0" fill="none" stroke="#111111" stroke-width="1.4"/><polygon points="460.0,624.0 454.6,615.0 465.4,615.0" fill="#111111" stroke="none" stroke-width="1.4"/><path d="M 460.0 696.0 L 460.0 724.0" fill="none" stroke="#111111" stroke-width="1.4"/><polygon points="460.0,724.0 454.6,715.0 465.4,715.0" fill="#111111" stroke="none" stroke-width="1.4"/><path d="M 460.0 796.0 L 460.0 824.0" fill="none" stroke="#111111" stroke-width="1.4"/><polygon points="460.0,824.0 454.6,815.0 465.4,815.0" fill="#111111" stroke="none" stroke-width="1.4"/><path d="M 460.0 896.0 L 460.0 924.0" fill="none" stroke="#111111" stroke-width="1.4"/><polygon points="460.0,924.0 454.6,915.0 465.4,915.0" fill="#111111" stroke="none" stroke-width="1.4"/><path d="M 460.0 1008.0 L 460.0 1034.0" fill="none" stroke="#111111" stroke-width="1.4"/><polygon points="460.0,1034.0 454.6,1025.0 465.4,1025.0" fill="#111111" stroke="none" stroke-width="1.4"/><path d="M 650.0 966.0 L 710.0 966.0 L 710.0 967.0 L 770.0 967.0" fill="none" stroke="#111111" stroke-width="1.4"/><polygon points="770.0,967.0 761.0,972.4 761.0,961.6" fill="#111111" stroke="none" stroke-width="1.4"/><path d="M 1050.0 967.0 L 1200.0 967.0 L 1200.0 360.0 L 690.0 360.0" fill="none" stroke="#111111" stroke-width="1.4" stroke-dasharray="6 4"/><polygon points="690.0,360.0 699.0,354.6 699.0,365.4" fill="#111111" stroke="none" stroke-width="1.4"/><path d="M 910.0 1006.0 L 910.0 1022.0 L 925.0 1022.0 L 925.0 1038.0" fill="none" stroke="#111111" stroke-width="1.4"/><polygon points="925.0,1038.0 919.6,1029.0 930.4,1029.0" fill="#111111" stroke="none" stroke-width="1.4"/><path d="M 460.0 1100.0 L 460.0 1132.0" fill="none" stroke="#111111" stroke-width="1.4"/><polygon points="460.0,1132.0 454.6,1123.0 465.4,1123.0" fill="#111111" stroke="none" stroke-width="1.4"/><path d="M 1050.0 444.0 L 1088.0 444.0 L 1088.0 1160.0 L 690.0 1160.0" fill="none" stroke="#111111" stroke-width="1.4"/><polygon points="690.0,1160.0 699.0,1154.6 699.0,1165.4" fill="#111111" stroke="none" stroke-width="1.4"/><path d="M 1050.0 561.0 L 1104.0 561.0 L 1104.0 1160.0 L 690.0 1160.0" fill="none" stroke="#111111" stroke-width="1.4" stroke-dasharray="6 4"/><polygon points="690.0,1160.0 699.0,1154.6 699.0,1165.4" fill="#111111" stroke="none" stroke-width="1.4"/><path d="M 1050.0 1068.0 L 1120.0 1068.0 L 1120.0 1160.0 L 690.0 1160.0" fill="none" stroke="#111111" stroke-width="1.4"/><polygon points="690.0,1160.0 699.0,1154.6 699.0,1165.4" fill="#111111" stroke="none" stroke-width="1.4"/><path d="M 460.0 1188.0 L 460.0 1220.0" fill="none" stroke="#111111" stroke-width="1.4"/><polygon points="460.0,1220.0 454.6,1211.0 465.4,1211.0" fill="#111111" stroke="none" stroke-width="1.4"/><rect x="697.0" y="426.6" width="16.1" height="13.7" rx="2" fill="#FFFFFF" stroke="none" stroke-width="0"/><text x="705.0" y="436.5" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="normal" fill="#111111" text-anchor="middle">No</text><rect x="449.4" y="482.1" width="21.1" height="13.7" rx="2" fill="#FFFFFF" stroke="none" stroke-width="0"/><text x="460.0" y="492.0" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="normal" fill="#111111" text-anchor="middle">Yes</text><rect x="717.0" y="544.6" width="16.1" height="13.7" rx="2" fill="#FFFFFF" stroke="none" stroke-width="0"/><text x="725.0" y="554.5" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="normal" fill="#111111" text-anchor="middle">No</text><rect x="449.4" y="597.1" width="21.1" height="13.7" rx="2" fill="#FFFFFF" stroke="none" stroke-width="0"/><text x="460.0" y="607.0" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="normal" fill="#111111" text-anchor="middle">Yes</text><rect x="449.4" y="1005.1" width="21.1" height="13.7" rx="2" fill="#FFFFFF" stroke="none" stroke-width="0"/><text x="460.0" y="1015.0" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="normal" fill="#111111" text-anchor="middle">Yes</text><rect x="702.0" y="950.6" width="16.1" height="13.7" rx="2" fill="#FFFFFF" stroke="none" stroke-width="0"/><text x="710.0" y="960.5" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="normal" fill="#111111" text-anchor="middle">No</text><rect x="1139.1" y="459.6" width="121.8" height="13.7" rx="2" fill="#FFFFFF" stroke="none" stroke-width="0"/><text x="1200.0" y="469.5" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="normal" fill="#111111" text-anchor="middle">Yes - feed results back</text><rect x="1134.1" y="470.6" width="131.9" height="13.7" rx="2" fill="#FFFFFF" stroke="none" stroke-width="0"/><text x="1200.0" y="480.5" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="normal" fill="#111111" text-anchor="middle">as functionResponse parts</text><rect x="909.5" y="1006.1" width="16.1" height="13.7" rx="2" fill="#FFFFFF" stroke="none" stroke-width="0"/><text x="917.5" y="1016.0" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="normal" fill="#111111" text-anchor="middle">No</text><text x="30.0" y="1086.0" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="bold" fill="#111111" text-anchor="start">LEGEND</text><rect x="30.0" y="1092.0" width="22.0" height="12.0" rx="6" fill="#FFFFFF" stroke="#111111" stroke-width="1.0"/><text x="60.0" y="1101.5" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="normal" fill="#5A5A5A" text-anchor="start">process / action</text><polygon points="41.0,1108.0 52.0,1115.0 41.0,1122.0 30.0,1115.0" fill="#FFFFFF" stroke="#111111" stroke-width="1.0"/><text x="60.0" y="1118.5" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="normal" fill="#5A5A5A" text-anchor="start">decision</text><rect x="30.0" y="1126.0" width="22.0" height="12.0" rx="2" fill="#FFFFFF" stroke="#111111" stroke-width="1.0"/><text x="60.0" y="1135.5" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="normal" fill="#5A5A5A" text-anchor="start">terminator / data</text><path d="M 30.0 1149.0 L 52.0 1149.0" fill="none" stroke="#111111" stroke-width="1.4"/><polygon points="52.0,1149.0 43.0,1154.4 43.0,1143.6" fill="#111111" stroke="none" stroke-width="1.4"/><text x="60.0" y="1152.5" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="normal" fill="#5A5A5A" text-anchor="start">control flow</text><path d="M 30.0 1166.0 L 52.0 1166.0" fill="none" stroke="#111111" stroke-width="1.4" stroke-dasharray="6 4"/><polygon points="52.0,1166.0 43.0,1171.4 43.0,1160.6" fill="#111111" stroke="none" stroke-width="1.4"/><text x="60.0" y="1169.5" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="normal" fill="#5A5A5A" text-anchor="start">loop / degraded path</text></svg>