<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="800" viewBox="0 0 1180 800"><rect x="0.0" y="0.0" width="1180.0" height="800.0" rx="0" fill="#FFFFFF" stroke="none" stroke-width="0"/><text x="590.0" y="28.0" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#111111" text-anchor="middle">Figure 3.27  Decision-Support Algorithm - Award Nomination</text><text x="590.0" y="46.0" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#5A5A5A" text-anchor="middle">AwardNominator: a focus profile per award type, six signals, and a fairness guard</text><rect x="50.0" y="92.0" width="300.0" height="176.0" rx="3" fill="#F4F4F4" stroke="#111111" stroke-width="1.4"/><text x="200.0" y="125.3" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#111111" text-anchor="middle">STEP 1  -  CLASSIFY THE AWARD TYPE</text><text x="200.0" y="138.3" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">keyword search over name + description</text><text x="200.0" y="151.3" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle"></text><text x="200.0" y="164.3" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">attendance  attendance, punctual, tardi,</text><text x="200.0" y="177.3" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">            presence, reliab</text><text x="200.0" y="190.3" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">tenure      service, tenure, loyal, anniversar,</text><text x="200.0" y="203.3" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">            milestone, veteran</text><text x="200.0" y="216.3" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">growth      training, learn, development, certif</text><text x="200.0" y="229.3" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">performance performance, excellen, outstand, mvp</text><text x="200.0" y="242.3" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#111111" text-anchor="middle">first match wins; unmatched -&gt; all-round</text><path d="M 50.0 300.0 H 338.0 L 350.0 312.0 V 490.0 H 50.0 Z" fill="#F4F4F4" stroke="#111111" stroke-width="1.0"/><path d="M 338.0 300.0 V 312.0 H 350.0" fill="none" stroke="#111111" stroke-width="1.0"/><text x="200.0" y="333.9" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="bold" fill="#111111" text-anchor="middle">STEP 4  -  THE FAIRNESS GUARD</text><text x="200.0" y="346.9" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle"></text><text x="200.0" y="359.9" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">Winning the SAME award within the</text><text x="200.0" y="372.9" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">last six months zeroes the</text><text x="200.0" y="385.9" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">recognition-gap signal outright and</text><text x="200.0" y="398.9" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">flags the nominee on the board.</text><text x="200.0" y="411.9" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle"></text><text x="200.0" y="424.9" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">The board therefore spreads</text><text x="200.0" y="437.9" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">recognition rather than crowning the</text><text x="200.0" y="450.9" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">same person twice - which is what a</text><text x="200.0" y="463.9" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">purely score-ranked list would do.</text><path d="M 50.0 520.0 H 338.0 L 350.0 532.0 V 700.0 H 50.0 Z" fill="#F4F4F4" stroke="#111111" stroke-width="1.0"/><path d="M 338.0 520.0 V 532.0 H 350.0" fill="none" stroke="#111111" stroke-width="1.0"/><text x="200.0" y="555.4" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="bold" fill="#111111" text-anchor="middle">STEP 5  -  CITATION DRAFT (LLM)</text><text x="200.0" y="568.4" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle"></text><text x="200.0" y="581.4" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">Gemini receives the employee, the</text><text x="200.0" y="594.4" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">award type and THAT NOMINEE'S REAL</text><text x="200.0" y="607.4" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">SIGNAL BREAKDOWN, and returns a warm,</text><text x="200.0" y="620.4" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">specific one-to-two sentence citation.</text><text x="200.0" y="633.4" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle"></text><text x="200.0" y="646.4" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">It is a draft the granter edits. It is</text><text x="200.0" y="659.4" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">never persisted on its own, and it</text><text x="200.0" y="672.4" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">never changes the ranking.</text><rect x="390.0" y="118.0" width="600.0" height="26.0" rx="0" fill="#E4E4E4" stroke="#111111" stroke-width="1.0"/><text x="465.0" y="135.0" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="bold" fill="#111111" text-anchor="middle">PROFILE</text><text x="575.0" y="135.0" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="bold" fill="#111111" text-anchor="middle">PERF</text><text x="645.0" y="135.0" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="bold" fill="#111111" text-anchor="middle">FCST</text><text x="715.0" y="135.0" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="bold" fill="#111111" text-anchor="middle">ATT</text><text x="790.0" y="135.0" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="bold" fill="#111111" text-anchor="middle">TRAIN</text><text x="875.0" y="135.0" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="bold" fill="#111111" text-anchor="middle">TENURE</text><text x="955.0" y="135.0" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="bold" fill="#111111" text-anchor="middle">GAP</text><rect x="390.0" y="144.0" width="600.0" height="24.0" rx="0" fill="#FFFFFF" stroke="#111111" stroke-width="1.0"/><text x="465.0" y="160.0" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="bold" fill="#111111" text-anchor="middle">Performance</text><text x="575.0" y="160.0" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="normal" fill="#111111" text-anchor="middle">40</text><text x="645.0" y="160.0" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="normal" fill="#111111" text-anchor="middle">10</text><text x="715.0" y="160.0" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="normal" fill="#111111" text-anchor="middle">15</text><text x="790.0" y="160.0" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="normal" fill="#111111" text-anchor="middle">10</text><text x="875.0" y="160.0" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="normal" fill="#111111" text-anchor="middle">-</text><text x="955.0" y="160.0" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="normal" fill="#111111" text-anchor="middle">25</text><rect x="390.0" y="168.0" width="600.0" height="24.0" rx="0" fill="#FFFFFF" stroke="#111111" stroke-width="1.0"/><text x="465.0" y="184.0" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="bold" fill="#111111" text-anchor="middle">Attendance</text><text x="575.0" y="184.0" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="normal" fill="#111111" text-anchor="middle">15</text><text x="645.0" y="184.0" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="normal" fill="#111111" text-anchor="middle">-</text><text x="715.0" y="184.0" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="normal" fill="#111111" text-anchor="middle">55</text><text x="790.0" y="184.0" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="normal" fill="#111111" text-anchor="middle">-</text><text x="875.0" y="184.0" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="normal" fill="#111111" text-anchor="middle">10</text><text x="955.0" y="184.0" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="normal" fill="#111111" text-anchor="middle">20</text><rect x="390.0" y="192.0" width="600.0" height="24.0" rx="0" fill="#FFFFFF" stroke="#111111" stroke-width="1.0"/><text x="465.0" y="208.0" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="bold" fill="#111111" text-anchor="middle">Tenure</text><text x="575.0" y="208.0" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="normal" fill="#111111" text-anchor="middle">15</text><text x="645.0" y="208.0" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="normal" fill="#111111" text-anchor="middle">-</text><text x="715.0" y="208.0" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="normal" fill="#111111" text-anchor="middle">10</text><text x="790.0" y="208.0" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="normal" fill="#111111" text-anchor="middle">-</text><text x="875.0" y="208.0" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="normal" fill="#111111" text-anchor="middle">55</text><text x="955.0" y="208.0" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="normal" fill="#111111" text-anchor="middle">20</text><rect x="390.0" y="216.0" width="600.0" height="24.0" rx="0" fill="#FFFFFF" stroke="#111111" stroke-width="1.0"/><text x="465.0" y="232.0" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="bold" fill="#111111" text-anchor="middle">Growth</text><text x="575.0" y="232.0" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="normal" fill="#111111" text-anchor="middle">20</text><text x="645.0" y="232.0" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="normal" fill="#111111" text-anchor="middle">-</text><text x="715.0" y="232.0" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="normal" fill="#111111" text-anchor="middle">10</text><text x="790.0" y="232.0" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="normal" fill="#111111" text-anchor="middle">50</text><text x="875.0" y="232.0" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="normal" fill="#111111" text-anchor="middle">-</text><text x="955.0" y="232.0" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="normal" fill="#111111" text-anchor="middle">20</text><rect x="390.0" y="240.0" width="600.0" height="24.0" rx="0" fill="#FFFFFF" stroke="#111111" stroke-width="1.0"/><text x="465.0" y="256.0" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="bold" fill="#111111" text-anchor="middle">All-round</text><text x="575.0" y="256.0" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="normal" fill="#111111" text-anchor="middle">30</text><text x="645.0" y="256.0" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="normal" fill="#111111" text-anchor="middle">10</text><text x="715.0" y="256.0" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="normal" fill="#111111" text-anchor="middle">15</text><text x="790.0" y="256.0" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="normal" fill="#111111" text-anchor="middle">10</text><text x="875.0" y="256.0" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="normal" fill="#111111" text-anchor="middle">10</text><text x="955.0" y="256.0" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="normal" fill="#111111" text-anchor="middle">25</text><rect x="390.0" y="312.0" width="740.0" height="138.0" rx="4" fill="#F4F4F4" stroke="#111111" stroke-width="1.0"/><text x="404.0" y="334.0" font-family="Consolas, 'Courier New', monospace" font-size="10" font-weight="normal" fill="#111111" text-anchor="start">Performance   (latest submitted appraisal overall - 1) / 4</text><text x="404.0" y="349.0" font-family="Consolas, 'Courier New', monospace" font-size="10" font-weight="normal" fill="#111111" text-anchor="start">Forecast      ML predicted rating / 100                     (only when a forecast run exists)</text><text x="404.0" y="364.0" font-family="Consolas, 'Courier New', monospace" font-size="10" font-weight="normal" fill="#111111" text-anchor="start">Attendance    over the last 90 days:  (present + 0.75 x (late + undertime)) / workdays</text><text x="404.0" y="379.0" font-family="Consolas, 'Courier New', monospace" font-size="10" font-weight="normal" fill="#111111" text-anchor="start">              leave days, days off and holidays are excused entirely</text><text x="404.0" y="394.0" font-family="Consolas, 'Courier New', monospace" font-size="10" font-weight="normal" fill="#111111" text-anchor="start">Training      completions in the last 12 months / 3, capped at 1</text><text x="404.0" y="409.0" font-family="Consolas, 'Courier New', monospace" font-size="10" font-weight="normal" fill="#111111" text-anchor="start">              refined as  base x 0.7 + (average score / 100) x 0.3</text><text x="404.0" y="424.0" font-family="Consolas, 'Courier New', monospace" font-size="10" font-weight="normal" fill="#111111" text-anchor="start">Tenure        years of service / 10, capped at 1</text><text x="404.0" y="439.0" font-family="Consolas, 'Courier New', monospace" font-size="10" font-weight="normal" fill="#111111" text-anchor="start">Gap           months since last recognised / 12, capped at 1;  never recognised = full marks</text><rect x="390.0" y="466.0" width="740.0" height="63.0" rx="4" fill="#E4E4E4" stroke="#111111" stroke-width="1.0"/><text x="404.0" y="488.0" font-family="Consolas, 'Courier New', monospace" font-size="10" font-weight="normal" fill="#111111" text-anchor="start">score = SUM(signal x weight) over ASSESSABLE signals / SUM(weight of those signals) x 100</text><text x="404.0" y="503.0" font-family="Consolas, 'Courier New', monospace" font-size="10" font-weight="normal" fill="#111111" text-anchor="start">        a signal with nothing to assess drops out and the rest renormalise</text><text x="404.0" y="518.0" font-family="Consolas, 'Courier New', monospace" font-size="10" font-weight="normal" fill="#111111" text-anchor="start">bands:  &gt;= 75 strong   &gt;= 55 promising   &gt;= 35 fair   otherwise weak      shortlist = top 5</text><text x="390.0" y="106.0" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="bold" fill="#111111" text-anchor="start">STEP 2  -  WEIGHTS PER FOCUS PROFILE  (each row sums to 100 before normalisation)</text><text x="390.0" y="300.0" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="bold" fill="#111111" text-anchor="start">STEP 3  -  THE SIX SIGNALS, EACH NORMALISED TO 0 .. 1</text><text x="760.0" y="748.0" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="normal" fill="#5A5A5A" text-anchor="middle">The whole ranking is arithmetic. The only LLM involvement is writing the words, after the decision is already made.</text></svg>