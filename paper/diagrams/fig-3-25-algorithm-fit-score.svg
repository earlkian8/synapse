<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="760" viewBox="0 0 1100 760"><rect x="0.0" y="0.0" width="1100.0" height="760.0" rx="0" fill="#FFFFFF" stroke="none" stroke-width="0"/><text x="550.0" y="28.0" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#111111" text-anchor="middle">Figure 3.25  Decision-Support Algorithm - Recruitment Fit Score</text><text x="550.0" y="46.0" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#5A5A5A" text-anchor="middle">ApplicantScorer: deterministic, explainable, and usable from the moment a candidate applies</text><rect x="50.0" y="90.0" width="250.0" height="150.0" rx="3" fill="#F4F4F4" stroke="#111111" stroke-width="1.4"/><text x="175.0" y="123.3" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="bold" fill="#111111" text-anchor="middle">INPUTS</text><text x="175.0" y="136.3" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="normal" fill="#5A5A5A" text-anchor="middle">recruiter star rating (0-5)</text><text x="175.0" y="149.3" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="normal" fill="#5A5A5A" text-anchor="middle">applicant years of experience</text><text x="175.0" y="162.3" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="normal" fill="#5A5A5A" text-anchor="middle">posting min_years_experience</text><text x="175.0" y="175.3" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="normal" fill="#5A5A5A" text-anchor="middle">posting required skills[]</text><text x="175.0" y="188.3" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="normal" fill="#5A5A5A" text-anchor="middle">headline + notes + cover note</text><text x="175.0" y="201.3" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="normal" fill="#5A5A5A" text-anchor="middle">interview results</text><text x="175.0" y="214.3" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="normal" fill="#5A5A5A" text-anchor="middle">resume + supporting documents</text><rect x="370.0" y="497.0" width="620.0" height="62.0" rx="3" fill="#FFFFFF" stroke="#111111" stroke-width="1.4"/><text x="680.0" y="525.4" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#111111" text-anchor="middle">BANDS</text><text x="680.0" y="538.4" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="normal" fill="#111111" text-anchor="middle">fit &gt;= 75  strong        fit &gt;= 55  promising        fit &gt;= 35  fair        otherwise  weak</text><rect x="370.0" y="579.0" width="620.0" height="96.0" rx="3" fill="#F4F4F4" stroke="#111111" stroke-width="1.4"/><text x="680.0" y="604.9" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#111111" text-anchor="middle">RECOMMENDED NEXT STEP  (stage x fit x interview verdict)</text><text x="680.0" y="617.9" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="normal" fill="#5A5A5A" text-anchor="middle">applied     fit &gt;= 55 -&gt; Advance to screening       else -&gt; Screen this candidate</text><text x="680.0" y="630.9" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="normal" fill="#5A5A5A" text-anchor="middle">screening   fit &gt;= 55 -&gt; Schedule an interview      else -&gt; Consider rejecting</text><text x="680.0" y="643.9" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="normal" fill="#5A5A5A" text-anchor="middle">interview   passed -&gt; Move to offer  |  failed -&gt; Consider rejecting  |  none -&gt; Awaiting result</text><text x="680.0" y="656.9" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="normal" fill="#5A5A5A" text-anchor="middle">offer       -&gt; Hire candidate</text><path d="M 50.0 270.0 H 288.0 L 300.0 282.0 V 470.0 H 50.0 Z" fill="#F4F4F4" stroke="#111111" stroke-width="1.0"/><path d="M 288.0 270.0 V 282.0 H 300.0" fill="none" stroke="#111111" stroke-width="1.0"/><text x="175.0" y="315.4" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="bold" fill="#111111" text-anchor="middle">WHY NORMALISE OVER WHAT</text><text x="175.0" y="328.4" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="bold" fill="#111111" text-anchor="middle">IS KNOWN</text><text x="175.0" y="341.4" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle"></text><text x="175.0" y="354.4" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">A candidate who has not been</text><text x="175.0" y="367.4" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">interviewed yet is not penalised</text><text x="175.0" y="380.4" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">for it. A posting that lists no</text><text x="175.0" y="393.4" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">skills simply drops that</text><text x="175.0" y="406.4" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">component. Ranking therefore</text><text x="175.0" y="419.4" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">works on day one and sharpens</text><text x="175.0" y="432.4" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">as recruiters rate and interview.</text><path d="M 50.0 500.0 H 288.0 L 300.0 512.0 V 650.0 H 50.0 Z" fill="#F4F4F4" stroke="#111111" stroke-width="1.0"/><path d="M 288.0 500.0 V 512.0 H 300.0" fill="none" stroke="#111111" stroke-width="1.0"/><text x="175.0" y="533.4" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="bold" fill="#111111" text-anchor="middle">COMPLEXITY</text><text x="175.0" y="546.4" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">O(k) per application, where k is</text><text x="175.0" y="559.4" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">the number of required skills.</text><text x="175.0" y="572.4" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">The score is persisted and</text><text x="175.0" y="585.4" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">invalidated by an INPUT HASH,</text><text x="175.0" y="598.4" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">not by a list of trigger events,</text><text x="175.0" y="611.4" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">so no call site can forget to</text><text x="175.0" y="624.4" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">invalidate it.</text><text x="370.0" y="140.0" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="bold" fill="#111111" text-anchor="start">Recruiter rating</text><text x="370.0" y="154.0" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="start">points = round(rating / 5 x 30)</text><rect x="620.0" y="129.0" width="180.0" height="16.0" rx="2" fill="#FFFFFF" stroke="#111111" stroke-width="1.0"/><rect x="620.0" y="129.0" width="180.0" height="16.0" rx="2" fill="#E4E4E4" stroke="#111111" stroke-width="1.0"/><text x="810.0" y="142.0" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="normal" fill="#5A5A5A" text-anchor="start">30 pts max</text><text x="370.0" y="186.0" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="bold" fill="#111111" text-anchor="start">Experience</text><text x="370.0" y="200.0" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="start">ratio = min(years / required, 1); no minimum set -&gt; years / 8</text><rect x="620.0" y="175.0" width="150.0" height="16.0" rx="2" fill="#FFFFFF" stroke="#111111" stroke-width="1.0"/><rect x="620.0" y="175.0" width="150.0" height="16.0" rx="2" fill="#E4E4E4" stroke="#111111" stroke-width="1.0"/><text x="780.0" y="188.0" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="normal" fill="#5A5A5A" text-anchor="start">25 pts max</text><text x="370.0" y="232.0" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="bold" fill="#111111" text-anchor="start">Skill keyword match</text><text x="370.0" y="246.0" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="start">matched / required, by substring over headline+notes+cover</text><rect x="620.0" y="221.0" width="120.0" height="16.0" rx="2" fill="#FFFFFF" stroke="#111111" stroke-width="1.0"/><rect x="620.0" y="221.0" width="120.0" height="16.0" rx="2" fill="#E4E4E4" stroke="#111111" stroke-width="1.0"/><text x="750.0" y="234.0" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="normal" fill="#5A5A5A" text-anchor="start">20 pts max</text><text x="370.0" y="278.0" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="bold" fill="#111111" text-anchor="start">Interview outcome</text><text x="370.0" y="292.0" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="start">passed = full, pending = half, failed = 0</text><rect x="620.0" y="267.0" width="90.0" height="16.0" rx="2" fill="#FFFFFF" stroke="#111111" stroke-width="1.0"/><rect x="620.0" y="267.0" width="90.0" height="16.0" rx="2" fill="#E4E4E4" stroke="#111111" stroke-width="1.0"/><text x="720.0" y="280.0" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="normal" fill="#5A5A5A" text-anchor="start">15 pts max</text><text x="370.0" y="324.0" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="bold" fill="#111111" text-anchor="start">Documents</text><text x="370.0" y="338.0" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="start">resume = 6 pts, then +1 per supporting document, capped at 4</text><rect x="620.0" y="313.0" width="60.0" height="16.0" rx="2" fill="#FFFFFF" stroke="#111111" stroke-width="1.0"/><rect x="620.0" y="313.0" width="60.0" height="16.0" rx="2" fill="#E4E4E4" stroke="#111111" stroke-width="1.0"/><text x="690.0" y="326.0" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="normal" fill="#5A5A5A" text-anchor="start">10 pts max</text><rect x="370.0" y="382.0" width="620.0" height="93.0" rx="4" fill="#F4F4F4" stroke="#111111" stroke-width="1.0"/><text x="384.0" y="404.0" font-family="Consolas, 'Courier New', monospace" font-size="10" font-weight="normal" fill="#111111" text-anchor="start">components that cannot be assessed DROP OUT of the calculation</text><text x="384.0" y="419.0" font-family="Consolas, 'Courier New', monospace" font-size="10" font-weight="normal" fill="#111111" text-anchor="start"></text><text x="384.0" y="434.0" font-family="Consolas, 'Courier New', monospace" font-size="10" font-weight="normal" fill="#111111" text-anchor="start">earned    = SUM(points of assessable components)</text><text x="384.0" y="449.0" font-family="Consolas, 'Courier New', monospace" font-size="10" font-weight="normal" fill="#111111" text-anchor="start">available = SUM(max of assessable components)</text><text x="384.0" y="464.0" font-family="Consolas, 'Courier New', monospace" font-size="10" font-weight="normal" fill="#111111" text-anchor="start">fit       = round(earned / available x 100)          -&gt; 0 .. 100</text><path d="M 175.0 240.0 L 175.0 270.0" fill="none" stroke="#111111" stroke-width="1.4"/><polygon points="175.0,270.0 169.6,261.0 180.4,261.0" fill="#111111" stroke="none" stroke-width="1.4"/><text x="370.0" y="106.0" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#111111" text-anchor="start">FIVE WEIGHTED COMPONENTS</text></svg>