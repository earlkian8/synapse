<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="874" viewBox="0 0 1180 874"><rect x="0.0" y="0.0" width="1180.0" height="874.0" rx="0" fill="#FFFFFF" stroke="none" stroke-width="0"/><text x="590.0" y="28.0" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#111111" text-anchor="middle">Figure 3.35  Security and Privacy Enforcement Layers</text><text x="590.0" y="46.0" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#5A5A5A" text-anchor="middle">Seven concentric controls; a request must satisfy every one of them, in this order</text><rect x="40.0" y="78.0" width="1100.0" height="92.0" rx="5" fill="#F4F4F4" stroke="#111111" stroke-width="1.4"/><text x="58.0" y="102.0" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#111111" text-anchor="start">1.  TRANSPORT &amp; BROWSER</text><text x="58.0" y="122.0" font-family="Arial, Helvetica, sans-serif" font-size="9.2" font-weight="normal" fill="#5A5A5A" text-anchor="start">TLS; SecurityHeaders sets a nonce-based CSP, X-Frame-Options and X-Content-Type-Options, and strips X-Powered-By on</text><text x="58.0" y="136.0" font-family="Arial, Helvetica, sans-serif" font-size="9.2" font-weight="normal" fill="#5A5A5A" text-anchor="start">every response including error pages</text><rect x="48.0" y="180.0" width="1084.0" height="92.0" rx="5" fill="#FFFFFF" stroke="#111111" stroke-width="1.4"/><text x="66.0" y="204.0" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#111111" text-anchor="start">2.  RATE LIMITING &amp; BOT CONTROL</text><text x="66.0" y="224.0" font-family="Arial, Helvetica, sans-serif" font-size="9.2" font-weight="normal" fill="#5A5A5A" text-anchor="start">login throttled per e-mail + IP; registration 6/min; workspace and invitation lookups 10/min; assistant 12/min and</text><text x="66.0" y="238.0" font-family="Arial, Helvetica, sans-serif" font-size="9.2" font-weight="normal" fill="#5A5A5A" text-anchor="start">240/day per user; public application form carries a honeypot field</text><rect x="56.0" y="282.0" width="1068.0" height="92.0" rx="5" fill="#F4F4F4" stroke="#111111" stroke-width="1.4"/><text x="74.0" y="306.0" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#111111" text-anchor="start">3.  IDENTITY</text><text x="74.0" y="326.0" font-family="Arial, Helvetica, sans-serif" font-size="9.2" font-weight="normal" fill="#5A5A5A" text-anchor="start">Fortify e-mail + password with verification and reset; optional TOTP two-factor and WebAuthn passkeys; Sanctum</text><text x="74.0" y="340.0" font-family="Arial, Helvetica, sans-serif" font-size="9.2" font-weight="normal" fill="#5A5A5A" text-anchor="start">bearer tokens for mobile, each minted bound to ONE organisation</text><rect x="64.0" y="384.0" width="1052.0" height="92.0" rx="5" fill="#FFFFFF" stroke="#111111" stroke-width="1.4"/><text x="82.0" y="408.0" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#111111" text-anchor="start">4.  TENANCY (ROW LEVEL)</text><text x="82.0" y="428.0" font-family="Arial, Helvetica, sans-serif" font-size="9.2" font-weight="normal" fill="#5A5A5A" text-anchor="start">SetCurrentOrganization binds the active org, always validated against organization_user; OrganizationScope</text><text x="82.0" y="442.0" font-family="Arial, Helvetica, sans-serif" font-size="9.2" font-weight="normal" fill="#5A5A5A" text-anchor="start">filters every read and stamps every write BELOW the query layer - so isolation holds regardless of permission</text><rect x="72.0" y="486.0" width="1036.0" height="92.0" rx="5" fill="#F4F4F4" stroke="#111111" stroke-width="1.4"/><text x="90.0" y="510.0" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#111111" text-anchor="start">5.  AUTHORIZATION</text><text x="90.0" y="530.0" font-family="Arial, Helvetica, sans-serif" font-size="9.2" font-weight="normal" fill="#5A5A5A" text-anchor="start">73 named permissions in 16 groups, defined in code and synced to the database, never the reverse;</text><text x="90.0" y="544.0" font-family="Arial, Helvetica, sans-serif" font-size="9.2" font-weight="normal" fill="#5A5A5A" text-anchor="start">can:&lt;ability&gt; on every route; bulk endpoints re-authorise each item; assistant tools are permission-scoped</text><text x="90.0" y="558.0" font-family="Arial, Helvetica, sans-serif" font-size="9.2" font-weight="normal" fill="#5A5A5A" text-anchor="start">before they are offered AND re-checked on execution</text><rect x="80.0" y="588.0" width="1020.0" height="92.0" rx="5" fill="#FFFFFF" stroke="#111111" stroke-width="1.4"/><text x="98.0" y="612.0" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#111111" text-anchor="start">6.  DATA PROTECTION AT REST</text><text x="98.0" y="632.0" font-family="Arial, Helvetica, sans-serif" font-size="9.2" font-weight="normal" fill="#5A5A5A" text-anchor="start">TIN, SSS, PhilHealth and Pag-IBIG encrypted (and therefore no longer SQL-searchable); documents stored on a</text><text x="98.0" y="646.0" font-family="Arial, Helvetica, sans-serif" font-size="9.2" font-weight="normal" fill="#5A5A5A" text-anchor="start">private disk, served only through a route, every access logged; government IDs and bank details render</text><text x="98.0" y="660.0" font-family="Arial, Helvetica, sans-serif" font-size="9.2" font-weight="normal" fill="#5A5A5A" text-anchor="start">masked with an explicit reveal</text><rect x="88.0" y="690.0" width="1004.0" height="92.0" rx="5" fill="#F4F4F4" stroke="#111111" stroke-width="1.4"/><text x="106.0" y="714.0" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#111111" text-anchor="start">7.  DISCLOSURE &amp; AI BOUNDARY</text><text x="106.0" y="734.0" font-family="Arial, Helvetica, sans-serif" font-size="9.2" font-weight="normal" fill="#5A5A5A" text-anchor="start">EmployeeDisclosure withholds nine fields from every assistant read at every permission level;</text><text x="106.0" y="748.0" font-family="Arial, Helvetica, sans-serif" font-size="9.2" font-weight="normal" fill="#5A5A5A" text-anchor="start">government-ID documents are never sent to the model; PROTECTED_FEATURES are never surfaced as decision</text><text x="106.0" y="762.0" font-family="Arial, Helvetica, sans-serif" font-size="9.2" font-weight="normal" fill="#5A5A5A" text-anchor="start">factors; retrieved text is data, never instruction</text><text x="590.0" y="840.0" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="normal" fill="#5A5A5A" text-anchor="middle">All live employee data is handled under Republic Act 10173 (Data Privacy Act of 2012): access control, tenant isolation, append-only audit logging and data minimisation.</text></svg>