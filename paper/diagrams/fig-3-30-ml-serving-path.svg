<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="814" viewBox="0 0 1200 814"><rect x="0.0" y="0.0" width="1200.0" height="814.0" rx="0" fill="#FFFFFF" stroke="none" stroke-width="0"/><text x="600.0" y="28.0" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#111111" text-anchor="middle">Figure 3.30  Machine Learning Serving Path and the Division of Labour</text><text x="600.0" y="46.0" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#5A5A5A" text-anchor="middle">What the Python service returns, and what the application server derives on top of it</text><rect x="40.0" y="84.0" width="1120.0" height="300.0" rx="4" fill="#FFFFFF" stroke="#111111" stroke-width="1.0" stroke-dasharray="6 4"/><text x="52.0" y="100.0" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="bold" fill="#5A5A5A" text-anchor="start">Laravel (application server)</text><rect x="40.0" y="396.0" width="1120.0" height="190.0" rx="4" fill="#FFFFFF" stroke="#111111" stroke-width="1.0" stroke-dasharray="6 4"/><text x="52.0" y="412.0" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="bold" fill="#5A5A5A" text-anchor="start">FastAPI (inference service)</text><rect x="40.0" y="606.0" width="1120.0" height="150.0" rx="4" fill="#FFFFFF" stroke="#111111" stroke-width="1.0" stroke-dasharray="6 4"/><text x="52.0" y="622.0" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="bold" fill="#5A5A5A" text-anchor="start">PostgreSQL</text><rect x="60.0" y="112.0" width="200.0" height="74.0" rx="3" fill="#FFFFFF" stroke="#111111" stroke-width="1.4"/><text x="160.0" y="139.8" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#111111" text-anchor="middle">Assessor</text><text x="160.0" y="152.8" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">gathers the active cohort</text><text x="160.0" y="165.8" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">with SQL aggregates</text><rect x="286.0" y="112.0" width="200.0" height="74.0" rx="3" fill="#FFFFFF" stroke="#111111" stroke-width="1.4"/><text x="386.0" y="139.8" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#111111" text-anchor="middle">FeatureMapper</text><text x="386.0" y="152.8" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">ERP vocabulary -&gt;</text><text x="386.0" y="165.8" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">model vocabulary</text><rect x="512.0" y="112.0" width="200.0" height="74.0" rx="3" fill="#FFFFFF" stroke="#111111" stroke-width="1.4"/><text x="612.0" y="139.8" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#111111" text-anchor="middle">MlClient</text><text x="612.0" y="152.8" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">POST /predict/{model}</text><text x="612.0" y="165.8" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">bounded timeout</text><rect x="738.0" y="112.0" width="200.0" height="74.0" rx="3" fill="#F4F4F4" stroke="#111111" stroke-width="1.4"/><text x="838.0" y="139.8" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#111111" text-anchor="middle">Derivation</text><text x="838.0" y="152.8" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">tier / band / confidence</text><text x="838.0" y="165.8" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">/ trajectory</text><rect x="964.0" y="112.0" width="180.0" height="74.0" rx="3" fill="#FFFFFF" stroke="#111111" stroke-width="1.4"/><text x="1054.0" y="146.3" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#111111" text-anchor="middle">Run writer</text><text x="1054.0" y="159.3" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">one transaction</text><rect x="60.0" y="216.0" width="426.0" height="60.0" rx="3" fill="#F4F4F4" stroke="#111111" stroke-width="1.4"/><text x="273.0" y="236.8" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#111111" text-anchor="middle">FEATURE MAPPING - notable translations</text><text x="273.0" y="249.8" font-family="Arial, Helvetica, sans-serif" font-size="8.6" font-weight="normal" fill="#5A5A5A" text-anchor="middle">never promoted -&gt; years-in-role and years-since-promotion fall back to tenure</text><text x="273.0" y="262.9" font-family="Arial, Helvetica, sans-serif" font-size="8.6" font-weight="normal" fill="#5A5A5A" text-anchor="middle">overtime -&gt; a Yes/No flag: 90-day approved overtime sum thresholded at 120 minutes</text><rect x="512.0" y="216.0" width="632.0" height="60.0" rx="3" fill="#F4F4F4" stroke="#111111" stroke-width="1.4"/><text x="828.0" y="230.3" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#111111" text-anchor="middle"></text><text x="828.0" y="243.3" font-family="Arial, Helvetica, sans-serif" font-size="8.6" font-weight="normal" fill="#5A5A5A" text-anchor="middle">performance rating clamped into the range the training data contained (1-4)</text><text x="828.0" y="256.4" font-family="Arial, Helvetica, sans-serif" font-size="8.6" font-weight="normal" fill="#5A5A5A" text-anchor="middle">employment type mapped regular/probationary/part-time/contractual -&gt; Full-time/Part-time/Contract</text><text x="828.0" y="269.4" font-family="Arial, Helvetica, sans-serif" font-size="8.6" font-weight="normal" fill="#5A5A5A" text-anchor="middle">anything ungroundable is OMITTED, never sent as a zero - a zero is a claim, an absence is honest</text><rect x="60.0" y="424.0" width="260.0" height="66.0" rx="3" fill="#FFFFFF" stroke="#111111" stroke-width="1.4"/><text x="190.0" y="447.9" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#111111" text-anchor="middle">Align</text><text x="190.0" y="460.9" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">full-width DataFrame in the</text><text x="190.0" y="473.9" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">pipeline's exact column order</text><rect x="346.0" y="424.0" width="260.0" height="66.0" rx="3" fill="#FFFFFF" stroke="#111111" stroke-width="1.4"/><text x="476.0" y="454.4" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#111111" text-anchor="middle">Impute + transform</text><text x="476.0" y="467.4" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">the fitted imputers fill the holes</text><rect x="632.0" y="424.0" width="240.0" height="66.0" rx="3" fill="#FFFFFF" stroke="#111111" stroke-width="1.4"/><text x="752.0" y="454.4" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#111111" text-anchor="middle">Score</text><text x="752.0" y="467.4" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">predict_proba | predict</text><rect x="898.0" y="424.0" width="246.0" height="66.0" rx="3" fill="#F4F4F4" stroke="#111111" stroke-width="1.4"/><text x="1021.0" y="447.9" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#111111" text-anchor="middle">Decompose (linear only)</text><text x="1021.0" y="460.9" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">signed per-feature logit</text><text x="1021.0" y="473.9" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">contributions</text><rect x="60.0" y="636.0" width="520.0" height="100.0" rx="3" fill="#F4F4F4" stroke="#111111" stroke-width="1.4"/><text x="320.0" y="676.9" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#111111" text-anchor="middle">*_runs   (header)</text><text x="320.0" y="689.9" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">who ran it, when, model_version, tier counts, average score,</text><text x="320.0" y="702.9" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">average confidence</text><rect x="620.0" y="636.0" width="524.0" height="100.0" rx="3" fill="#F4F4F4" stroke="#111111" stroke-width="1.4"/><text x="882.0" y="676.9" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#111111" text-anchor="middle">*_scores   (one row per employee)</text><text x="882.0" y="689.9" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">probability, score, tier or band, confidence or factors, and the</text><text x="882.0" y="702.9" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">EXACT FEATURE SNAPSHOT that was sent</text><path d="M 260.0 149.0 L 286.0 149.0" fill="none" stroke="#111111" stroke-width="1.4"/><polygon points="286.0,149.0 277.0,154.4 277.0,143.6" fill="#111111" stroke="none" stroke-width="1.4"/><path d="M 486.0 149.0 L 512.0 149.0" fill="none" stroke="#111111" stroke-width="1.4"/><polygon points="512.0,149.0 503.0,154.4 503.0,143.6" fill="#111111" stroke="none" stroke-width="1.4"/><path d="M 712.0 149.0 L 738.0 149.0" fill