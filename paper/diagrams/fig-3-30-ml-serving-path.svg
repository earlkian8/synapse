fill="#111111" text-anchor="middle">{ instances: [ { ref, features } ] }</text><rect x="833.4" y="289.1" width="192.3" height="13.7" rx="2" fill="#FFFFFF" stroke="none" stroke-width="0"/><text x="929.5" y="299.0" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="normal" fill="#111111" text-anchor="middle">{ probability, score, tier, factors }</text><text x="40.0" y="780.0" font-family="Arial, Helvetica, sans-serif" font-size="8.5" font-weight="normal" fill="#5A5A5A" text-anchor="start">Promotion returns probability, score, tier AND real per-feature factors (the model is linear, so the 'why' is genuine).  Attrition returns probability, score, tier - confidence is derived.  Performance returns a predicted value only - band and confidence are both derived.</text></svg>