F" stroke="none" stroke-width="0"/><text x="843.0" y="309.0" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="normal" fill="#111111" text-anchor="middle">HTTPS (server-side only)</text><rect x="809.8" y="359.1" width="66.4" height="13.7" rx="2" fill="#FFFFFF" stroke="none" stroke-width="0"/><text x="843.0" y="369.0" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="normal" fill="#111111" text-anchor="middle">SMTP / VAPID</text><text x="560.0" y="610.0" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="normal" fill="#5A5A5A" text-anchor="middle">Everything inside the dashed perimeter is institution-owned and can run on one machine. The only hard external dependency is the Gemini API,</text><text x="560.0" y="626.0" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="normal" fill="#5A5A5A" text-anchor="middle">and it is optional: with no API key configured every AI surface degrades to a disabled panel.</text><text x="60.0" y="508.0" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="bold" fill="#111111" text-anchor="start">LEGEND</text><rect x="60.0" y="514.0" width="22.0" height="12.0" rx="2" fill="#FFFFFF" stroke="#111111" stroke-width="1.0"/><text x="90.0" y="523.5" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="normal" fill="#5A5A5A" text-anchor="start">node / artifact</text><rect x="60.0" y="531.0" width="22.0" height="12.0" rx="2" fill="#FFFFFF" stroke="#111111" stroke-width="1.0" stroke-dasharray="3 3"/><text x="90.0" y="540.5" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="normal" fill="#5A5A5A" text-anchor="start">external service</text><path d="M 60.0 554.0 L 82.0 554.0" fill="none" stroke="#111111" stroke-width="1.4"/><polygon points="82.0,554.0 73.0,559.4 73.0,548.6" fill="#111111" stroke="none" stroke-width="1.4"/><text x="90.0" y="557.5" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="normal" fill="#5A5A5A" text-anchor="start">protocol binding</text></svg>