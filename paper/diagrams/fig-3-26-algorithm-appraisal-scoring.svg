<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="800" viewBox="0 0 1140 800"><rect x="0.0" y="0.0" width="1140.0" height="800.0" rx="0" fill="#FFFFFF" stroke="none" stroke-width="0"/><text x="570.0" y="28.0" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#111111" text-anchor="middle">Figure 3.26  Decision-Support Algorithm - Two-Level Appraisal Scoring</text><text x="570.0" y="46.0" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#5A5A5A" text-anchor="middle">PerformanceScorer: every line is rated on its own scale, weighted in its section, and sections are weighted against each other</text><rect x="610.0" y="96.0" width="480.0" height="300.0" rx="3" fill="#FFFFFF" stroke="#111111" stroke-width="1.4"/><text x="850.0" y="249.8" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="bold" fill="#111111" text-anchor="middle">WORKED EXAMPLE</text><path d="M 610.0 420.0 H 1078.0 L 1090.0 432.0 V 550.0 H 610.0 Z" fill="#F4F4F4" stroke="#111111" stroke-width="1.0"/><path d="M 1078.0 420.0 V 432.0 H 1090.0" fill="none" stroke="#111111" stroke-width="1.0"/><text x="850.0" y="449.9" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="bold" fill="#111111" text-anchor="middle">SNAPSHOTTING - WHY OLD APPRAISALS NEVER CHANGE</text><text x="850.0" y="462.9" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">An appraisal freezes the framework it was opened under: name,</text><text x="850.0" y="475.9" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">sections and rating model. Each score line freezes its section</text><text x="850.0" y="488.9" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">(key, name, weight), its own weight, its description and its full</text><text x="850.0" y="501.9" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">rating scale. Retuning a framework, retiring a criterion or editing</text><text x="850.0" y="514.9" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">a scale changes the NEXT appraisal and never a past one - and the</text><text x="850.0" y="527.9" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">historical result can be rebuilt from the lines alone.</text><path d="M 60.0 415.0 H 548.0 L 560.0 427.0 V 525.0 H 60.0 Z" fill="#F4F4F4" stroke="#111111" stroke-width="1.0"/><path d="M 548.0 415.0 V 427.0 H 560.0" fill="none" stroke="#111111" stroke-width="1.0"/><text x="310.0" y="428.4" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="bold" fill="#111111" text-anchor="middle">TWO DELIBERATE FALLBACKS</text><text x="310.0" y="441.4" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">1. A section that declares no weight falls back to the sum of the</text><text x="310.0" y="454.4" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">   weights of the lines inside it - so a flat, unsectioned scorecard</text><text x="310.0" y="467.4" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">   scores exactly as a plain weighted average.</text><text x="310.0" y="480.4" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">2. The 1-5 overall is an AFFINE PROJECTION of the same 0-100 figure,</text><text x="310.0" y="493.4" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">   kept only so the ML pipelines and the awards nominator have one</text><text x="310.0" y="506.4" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">   stable meaning of 'overall'. It is a compatibility layer, not a</text><text x="310.0" y="519.4" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">   second opinion.</text><rect x="60.0" y="610.0" width="1030.0" height="130.0" rx="3" fill="#FFFFFF" stroke="#111111" stroke-width="1.4"/><text x="575.0" y="646.4" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="bold" fill="#111111" text-anchor="middle">CALIBRATION  -  PerformanceCalibration, computed per review cycle</text><text x="575.0" y="659.4" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="normal" fill="#5A5A5A" text-anchor="middle">coverage against active headcount   |   in-progress and awaiting-sign-off counts   |   average attainment</text><text x="575.0" y="672.4" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="normal" fill="#5A5A5A" text-anchor="middle">band spread across the tenant's OWN bands (grouped by the words they were actually reported in, because a</text><text x="575.0" y="685.4" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="normal" fill="#5A5A5A" text-anchor="middle">cycle may run several frameworks at once)   |   per-department deviation from the cycle average</text><text x="575.0" y="698.4" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="normal" fill="#5A5A5A" text-anchor="middle"></text><text x="575.0" y="711.4" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="normal" fill="#111111" text-anchor="middle">Rating inflation is invisible one scorecard at a time and obvious the moment the distribution is on screen.</text><rect x="60.0" y="104.0" width="500.0" height="93.0" rx="4" fill="#F4F4F4" stroke="#111111" stroke-width="1.0"/><text x="74.0" y="126.0" font-family="Consolas, 'Courier New', monospace" font-size="10" font-weight="normal" fill="#111111" text-anchor="start">fraction = (score - scale_min) / (scale_max - scale_min)   -&gt; 0 .. 1</text><text x="74.0" y="141.0" font-family="Consolas, 'Courier New', monospace" font-size="10" font-weight="normal" fill="#111111" text-anchor="start"></text><text x="74.0" y="156.0" font-family="Consolas, 'Courier New', monospace" font-size="10" font-weight="normal" fill="#111111" text-anchor="start">numeric      1-5, 1-4, 1-10 with a declared step</text><text x="74.0" y="171.0" font-family="Consolas, 'Courier New', monospace" font-size="10" font-weight="normal" fill="#111111" text-anchor="start">percentage   0-100 goal attainment</text><text x="74.0" y="186.0" font-family="Consolas, 'Courier New', monospace" font-size="10" font-weight="normal" fill="#111111" text-anchor="start">levels       ordered named levels with behavioural anchors</text><rect x="60.0" y="243.0" width="500.0" height="138.0" rx="4" fill="#F4F4F4" stroke="#111111" stroke-width="1.0"/><text x="74.0" y="265.0" font-family="Consolas, 'Courier New', monospace" font-size="10" font-weight="normal" fill="#111111" text-anchor="start">section% = SUM(fraction_i x weight_i) / SUM(weight_i) x 100</text><text x="74.0" y="280.0" font-family="Consolas, 'Courier New', monospace" font-size="10" font-weight="normal" fill="#111111" text-anchor="start">                 (only RATED lines contribute)</text><text x="74.0" y="295.0" font-family="Consolas, 'Courier New', monospace" font-size="10" font-weight="normal" fill="#111111" text-anchor="start"></text><text x="74.0" y="310.0" font-family="Consolas, 'Courier New', monospace" font-size="10" font-weight="normal" fill="#111111" text-anchor="start">overall% = SUM(section%_s x weight_s) / SUM(weight_s)</text><text x="74.0" y="325.0" font-family="Consolas, 'Courier New', monospace" font-size="10" font-weight="normal" fill="#111111" text-anchor="start">                 (only sections with something rated)</text><text x="74.0" y="340.0" font-family="Consolas, 'Courier New', monospace" font-size="10" font-weight="normal" fill="#111111" text-anchor="start"></text><text x="74.0" y="355.0" font-family="Consolas, 'Courier New', monospace" font-size="10" font-weight="normal" fill="#111111" text-anchor="start">result_band   = highest band whose min_percent overall% reaches</text><text x="74.0" y="370.0" font-family="Consolas, 'Courier New', monospace" font-size="10" font-weight="normal" fill="#111111" text-anchor="start">overall_score = 1 + (overall% / 100) x 4       &lt;- the 1-5 projection</text><text x="624.0" y="128.0" font-family="Consolas, 'Courier New', monospace" font-size="9.6" font-weight="bold" fill="#111111" text-anchor="start">Goals  (section weight 60)</text><text x="624.0" y="148.0" font-family="Consolas, 'Courier New', monospace" font-size="9.6" font-weight="normal" fill="#5A5A5A" text-anchor="start">   Revenue target      0-100 scale, 82        w 60</text><text x="1076.0" y="148.0" font-family="Consolas, 'Courier New', monospace" font-size="9.6" font-weight="normal" fill="#111111" text-anchor="end">0.82</text><text x="624.0" y="168.0" font-family="Consolas, 'Courier New', monospace" font-size="9.6" font-weight="normal" fill="#5A5A5A" text-anchor="start">   Delivery on time    1-5 scale, 4           w 40</text><text x="1076.0" y="168.0" font-family="Consolas, 'Courier New', monospace" font-size="9.6" font-weight="normal" fill="#111111" text-anchor="end">0.75</text><text x="624.0" y="188.0" font-family="Consolas, 'Courier New', monospace" font-size="9.6" font-weight="bold" fill="#111111" text-anchor="start">   -&gt; section% = (0.82x60 + 0.75x40)/100 = 79.20</text><text x="624.0" y="208.0" font-family="Consolas, 'Courier New', monospace" font-size="9.6" font-weight="bold" fill="#111111" text-anchor="start">Competencies  (section weight 30)</text><text x="624.0" y="228.0" font-family="Consolas, 'Courier New', monospace" font-size="9.6" font-weight="normal" fill="#5A5A5A" text-anchor="start">   Collaboration       levels L3 of L4        w 100</text><text x="1076.0" y="228.0" font-family="Consolas, 'Courier New', monospace" font-size="9.6" font-weight="normal" fill="#111111" text-anchor="end">0.67</text><text x="624.0" y="248.0" font-family="Consolas, 'Courier New', monospace" font-size="9.6" font-weight="bold" fill="#111111" text-anchor="start">   -&gt; section% = 66.67</text><text x="624.0" y="268.0" font-family="Consolas, 'Courier New', monospace" font-size="9.6" font-weight="bold" fill="#111111" text-anchor="start">Values  (section weight 10)  - nothing rated</text><text x="624.0" y="288.0" font-family="Consolas, 'Courier New', monospace" font-size="9.6" font-weight="normal" fill="#5A5A5A" text-anchor="start">   -&gt; excluded entirely, not scored as zero</text><text x="624.0" y="308.0" font-family="Consolas, 'Courier New', monospace" font-size="9.6" font-weight="normal" fill="#5A5A5A" text-anchor="start"></text><text x="624.0" y="328.0" font-family="Consolas, 'Courier New', monospace" font-size="9.6" font-weight="bold" fill="#111111" text-anchor="start">overall% = (79.20x60 + 66.67x30) / 90 = 75.02</text><text x="624.0" y="348.0" font-family="Consolas, 'Courier New', monospace" font-size="9.6" font-weight="bold" fill="#111111" text-anchor="start">result_band = 'Exceeds' (min_percent 75)</text><text x="624.0" y="368.0" font-family="Consolas, 'Courier New', monospace" font-size="9.6" font-weight="bold" fill="#111111" text-anchor="start">overall_score = 1 + 0.7502 x 4 = 4.00</text><text x="60.0" y="92.0" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#111111" text-anchor="start">LEVEL 1  -  each line's position on ITS OWN scale</text><text x="60.0" y="231.0" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#111111" text-anchor="start">LEVEL 2  -  section attainment, then the overall</text></svg>