<svg xmlns="http://www.w3.org/2000/svg" width="1302" height="1055" viewBox="0 0 1302 1055"><rect x="0.0" y="0.0" width="1302.0" height="1055.0" rx="0" fill="#FFFFFF" stroke="none" stroke-width="0"/><text x="651.0" y="28.0" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#111111" text-anchor="middle">Figure 3.15  Level-2 Data Flow Diagram - Offboarding</text><text x="651.0" y="46.0" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#5A5A5A" text-anchor="middle">Department-routed clearance and the separation bridge</text><rect x="26.0" y="196.0" width="190.0" height="84.0" rx="0" fill="#FFFFFF" stroke="#111111" stroke-width="2.0"/><text x="121.0" y="241.7" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="normal" fill="#111111" text-anchor="middle">HR Manager</text><rect x="26.0" y="508.0" width="190.0" height="84.0" rx="0" fill="#FFFFFF" stroke="#111111" stroke-width="2.0"/><text x="121.0" y="540.7" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="normal" fill="#111111" text-anchor="middle">Clearing Departments</text><text x="121.0" y="553.7" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">IT, Finance, HR, and the</text><text x="121.0" y="566.7" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">employee's own department</text><rect x="300.0" y="92.0" width="356.0" height="84.0" rx="8" fill="#FFFFFF" stroke="#111111" stroke-width="1.4"/><path d="M 300.0 110.0 L 656.0 110.0" fill="none" stroke="#111111" stroke-width="1.0"/><text x="478.0" y="105.5" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="bold" fill="#111111" text-anchor="middle">10.1</text><text x="478.0" y="140.2" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="normal" fill="#111111" text-anchor="middle">Maintain clearance templates</text><text x="478.0" y="153.2" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">configured under Company Setup</text><rect x="300.0" y="196.0" width="356.0" height="84.0" rx="8" fill="#FFFFFF" stroke="#111111" stroke-width="1.4"/><path d="M 300.0 214.0 L 656.0 214.0" fill="none" stroke="#111111" stroke-width="1.0"/><text x="478.0" y="209.5" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="bold" fill="#111111" text-anchor="middle">10.2</text><text x="478.0" y="237.7" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="normal" fill="#111111" text-anchor="middle">Open the exit case</text><text x="478.0" y="250.7" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">type, notice date, last working day,</text><text x="478.0" y="263.7" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">reason</text><rect x="300.0" y="300.0" width="356.0" height="84.0" rx="8" fill="#FFFFFF" stroke="#111111" stroke-width="1.4"/><path d="M 300.0 318.0 L 656.0 318.0" fill="none" stroke="#111111" stroke-width="1.0"/><text x="478.0" y="313.5" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="bold" fill="#111111" text-anchor="middle">10.3</text><text x="478.0" y="341.7" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="normal" fill="#111111" text-anchor="middle">Seed and route the items</text><text x="478.0" y="354.7" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">OffboardingProvisioner routes each item</text><text x="478.0" y="367.7" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">to the department that must sign it off</text><rect x="300.0" y="404.0" width="356.0" height="84.0" rx="8" fill="#FFFFFF" stroke="#111111" stroke-width="1.4"/><path d="M 300.0 422.0 L 656.0 422.0" fill="none" stroke="#111111" stroke-width="1.0"/><text x="478.0" y="417.5" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="bold" fill="#111111" text-anchor="middle">10.4</text><text x="478.0" y="452.2" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="normal" fill="#111111" text-anchor="middle">Sign off or flag an item</text><text x="478.0" y="465.2" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">item-level and bulk clearing</text><rect x="300.0" y="508.0" width="356.0" height="84.0" rx="8" fill="#FFFFFF" stroke="#111111" stroke-width="1.4"/><path d="M 300.0 526.0 L 656.0 526.0" fill="none" stroke="#111111" stroke-width="1.0"/><text x="478.0" y="521.5" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="bold" fill="#111111" text-anchor="middle">10.5</text><text x="478.0" y="549.7" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="normal" fill="#111111" text-anchor="middle">Derive the clearance status</text><text x="478.0" y="562.7" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">pending / in_progress / cleared;</text><text x="478.0" y="575.7" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">a flagged item keeps a case off 'cleared'</text><rect x="300.0" y="612.0" width="356.0" height="84.0" rx="8" fill="#FFFFFF" stroke="#111111" stroke-width="1.4"/><path d="M 300.0 630.0 L 656.0 630.0" fill="none" stroke="#111111" stroke-width="1.0"/><text x="478.0" y="625.5" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="bold" fill="#111111" text-anchor="middle">10.6</text><text x="478.0" y="653.7" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="normal" fill="#111111" text-anchor="middle">Advance the lifecycle</text><text x="478.0" y="666.7" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">initiated -&gt; clearance -&gt; completed,</text><text x="478.0" y="679.7" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">or cancelled</text><rect x="300.0" y="716.0" width="356.0" height="84.0" rx="8" fill="#FFFFFF" stroke="#111111" stroke-width="1.4"/><path d="M 300.0 734.0 L 656.0 734.0" fill="none" stroke="#111111" stroke-width="1.0"/><text x="478.0" y="729.5" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="bold" fill="#111111" text-anchor="middle">10.7</text><text x="478.0" y="757.7" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="normal" fill="#111111" text-anchor="middle">Separate the employee</text><text x="478.0" y="770.7" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">employment_status is transitioned to</text><text x="478.0" y="783.7" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">match the exit type - never set by hand</text><rect x="300.0" y="820.0" width="356.0" height="84.0" rx="8" fill="#FFFFFF" stroke="#111111" stroke-width="1.4"/><path d="M 300.0 838.0 L 656.0 838.0" fill="none" stroke="#111111" stroke-width="1.0"/><text x="478.0" y="833.5" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="bold" fill="#111111" text-anchor="middle">10.8</text><text x="478.0" y="868.2" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="normal" fill="#111111" text-anchor="middle">Export clearance</text><text x="478.0" y="881.2" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#5A5A5A" text-anchor="middle">CSV, grouped per department</text><rec