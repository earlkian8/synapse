[global]
error_log = /proc/self/fd/2
log_limit = 8192

[www]
listen = 127.0.0.1:9000
; Keep DigitalOcean's environment variables visible to the app.
clear_env = no
catch_workers_output = yes
decorate_workers_output = no
access.log = /dev/null

pm = dynamic
pm.max_children = 12
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 5
pm.max_requests = 500

; Model training (ML_SERVICE_TRAIN_TIMEOUT, 300 s) runs inside a web request.
request_terminate_timeout = 600
