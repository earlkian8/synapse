[global]
error_log = /proc/self/fd/2
log_limit = 8192

[www]
listen = 127.0.0.1:9000
; Keep DigitalOcean's environment variables visible to the app.
clear_env = no
catch_workers_output = yes
decorate_workers_output = no
access.log = /dev/null

; ondemand: no PHP worker waits in memory while nobody is using the app. A
; worker is forked from the master when a request arrives (a fraction of a
; millisecond; opcache is shared, so it starts warm) and exits after
; process_idle_timeout without one. A dynamic pool kept 3-5 workers of ~40 MB
; each alive around the clock. The platform's health check (/up) keeps at most
; one warm.
pm = ondemand
; Each worker can grow to memory_limit on a heavy request (an export, a report):
; size this to the instance (PHP_FPM_MAX_CHILDREN, set by the entrypoint).
pm.max_children = ${PHP_FPM_MAX_CHILDREN}
pm.process_idle_timeout = 30s
pm.max_requests = 500

; Model training (ML_SERVICE_TRAIN_TIMEOUT, 300 s) runs inside a web request.
request_terminate_timeout = 600
