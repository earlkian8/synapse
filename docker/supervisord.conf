; Every process logs to the container's stdout/stderr (DigitalOcean's log viewer).
[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

; No [unix_http_server]/supervisorctl: App Platform's sandbox cannot bind the
; control socket, and supervisord then loops forever before starting anything.

[program:php-fpm]
command=php-fpm --nodaemonize
priority=10
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
priority=20
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; The ML inference service. Bound to loopback: only Laravel calls it.
[program:ml]
command=/opt/ml-venv/bin/python -m uvicorn api.main:app --host 127.0.0.1 --port 8001 --workers %(ENV_ML_WORKERS)s
directory=/app/model
user=www-data
; supervisord keeps root's HOME; libpq then fails reading /root/.postgresql.
environment=HOME="/var/www",USER="www-data"
priority=5
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:queue]
command=php /app/server/artisan queue:work --sleep=3 --tries=3 --max-time=3600
directory=/app/server
user=www-data
; supervisord keeps root's HOME; libpq then fails reading /root/.postgresql.
environment=HOME="/var/www",USER="www-data"
autostart=%(ENV_RUN_QUEUE)s
autorestart=true
; Keep retrying while the database is briefly unreachable at boot.
startretries=1000
stopwaitsecs=60
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:scheduler]
command=php /app/server/artisan schedule:work
directory=/app/server
user=www-data
; supervisord keeps root's HOME; libpq then fails reading /root/.postgresql.
environment=HOME="/var/www",USER="www-data"
autostart=%(ENV_RUN_SCHEDULER)s
autorestart=true
; Keep retrying while the database is briefly unreachable at boot.
startretries=1000
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
